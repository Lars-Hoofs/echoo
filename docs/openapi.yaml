  /custom-attributes:
    get:
      tags: [Contacts]
      summary: List custom attribute definitions
      parameters:
        - { name: entity, in: query, schema: { type: string, enum: [contact, organization, conversation] } }
      responses:
        "200":
          description: Definitions ordered by entity and creation.
          content:
            application/json:
              schema:
                type: object
                required: [attributes]
                properties:
                  attributes:
                    type: array
                    items: { $ref: "#/components/schemas/AttributeDef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Contacts]
      summary: Create a custom attribute definition
      description: |
        Admin only. The `key` (lower-case slug) and `type` cannot change afterwards. A list needs
        1 to 50 `options`. At most 50 definitions per entity. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, key, label, type]
              properties:
                entity: { type: string, enum: [contact, organization, conversation] }
                key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
                label: { type: string, maxLength: 60 }
                type: { type: string, enum: [text, number, date, boolean, list, link] }
                options: { type: array, items: { type: string, maxLength: 60 } }
      responses:
        "201":
          description: The definition.
          content:
            application/json:
              schema:
                type: object
                required: [attribute]
                properties:
                  attribute: { $ref: "#/components/schemas/AttributeDef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /custom-attributes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Contacts]
      summary: Edit a custom attribute definition
      description: Admin only. Only `label` and, for a list, `options` can change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 60 }
                options: { type: array, items: { type: string, maxLength: 60 } }
      responses:
        "200":
          description: The definition.
          content:
            application/json:
              schema:
                type: object
                required: [attribute]
                properties:
                  attribute: { $ref: "#/components/schemas/AttributeDef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Contacts]
      summary: Delete a custom attribute definition
      description: Admin only. Also removes every stored value of that key. Audited with the number of values removed.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{id}/attributes:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Custom attributes of a conversation
      responses:
        "200":
          description: The values by key.
          content:
            application/json:
              schema:
                type: object
                required: [attributes]
                properties:
                  attributes: { $ref: "#/components/schemas/CustomAttributeValues" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Contacts]
      summary: Change custom attributes of a conversation
      description: A patch, validated against the conversation attribute definitions. Needs write access to the mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attributes]
              properties:
                attributes: { $ref: "#/components/schemas/CustomAttributeValues" }
      responses:
        "200":
          description: The values after the change.
          content:
            application/json:
              schema:
                type: object
                required: [attributes]
                properties:
                  attributes: { $ref: "#/components/schemas/CustomAttributeValues" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /contact-segments:
    get:
      tags: [Contacts]
      summary: List contact segments
      description: Your own segments and every shared one.
      responses:
        "200":
          description: Segments by name.
          content:
            application/json:
              schema:
                type: object
                required: [segments]
                properties:
                  segments:
                    type: array
