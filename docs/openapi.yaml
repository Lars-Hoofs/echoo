openapi: 3.0.3
info:
  title: Echoo API
  version: "1"
  description: |
    The HTTP API of Echoo, a self-hosted email helpdesk. The web app uses exactly this API.

    Authentication. Integrations send a personal API token as `Authorization: Bearer ech_...`.
    A token acts as the user who created it and never has more rights than that user; the `read`
    scope allows GET only. When an Authorization header is present the session cookie is ignored
    and no CSRF or Origin check applies. Tokens cannot manage sessions, passwords, two-factor
    authentication or other tokens; those routes need a browser session.

    Browser sessions use an HttpOnly cookie plus, on every non-GET request, the `X-CSRF-Token`
    header (from `POST /auth/login` or `GET /me`) and an `Origin` equal to the configured base URL.

    Permissions. What a user may do follows from a closed list of permission keys (see
    `GET /roles`). The built-in roles are presets of that list and custom roles pick their own; the
    effective list of the signed-in user is `permissions` in `GET /me`. Routes marked (admin) in this
    document need one of the permissions named in their description, not a specific role. Which
    mailboxes a user reaches is still decided by team access.

    Every error has the shape `{"error": {"code": "...", "message": "...", "fields": {...}}}`.
    Codes are stable; messages are for developers. Each token may make 600 requests a minute;
    beyond that the API answers 429 with a `Retry-After` header.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
    csrfToken: []
tags:
  - name: Account
  - name: API tokens
  - name: Webhooks
  - name: Operations
  - name: Audit
  - name: Mailboxes
  - name: Conversations
  - name: Users and teams
  - name: Realtime
  - name: Automation
  - name: Reports
  - name: Contacts
  - name: Knowledge base
  - name: Campaigns
paths:
  /openapi.yaml:
    get:
      tags: [Operations]
      summary: This document
      responses:
        "200":
          description: The OpenAPI description.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/tokens:
    get:
      tags: [API tokens]
      summary: List your API tokens
      description: Active tokens only. The token value itself is never shown again.
      responses:
        "200":
          description: Your tokens, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [API tokens]
      summary: Create an API token
      description: Needs a browser session. The `token` in the response is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, maxLength: 100 }
                scope: { type: string, enum: [read, write] }
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Must be in the future and at most five years away. Omit for no expiry.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [token, api_token]
                properties:
                  token: { type: string, description: "The secret, starting with ech_." }
                  api_token: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/tokens/{id}:
    delete:
      tags: [API tokens]
      summary: Revoke one of your API tokens
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tokens:
    get:
      tags: [API tokens]
      summary: List everybody's active API tokens (admin)
      responses:
        "200":
          description: All active tokens with their owner.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tokens/{id}:
    delete:
      tags: [API tokens]
      summary: Revoke any API token (admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks (admin)
      responses:
        "200":
          description: All webhooks.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Webhooks]
      summary: Create a webhook (admin)
      description: |
        The URL must be https, on port 443 or 8443, and must not point to an internal network;
        the destination is checked again on every connection. Plain http needs `allow_http`,
        which only the owner may set. The signing secret is generated by the server and shown
        once in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                include_content:
                  type: boolean
                  default: false
                  description: Add message subject and preview, conversation subject, contact name and address to payloads.
                allow_http: { type: boolean, default: false }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, secret]
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
                  secret: { type: string, description: "Shown once, starts with whsec_." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /webhooks/{id}:
    patch:
      tags: [Webhooks]
      summary: Change a webhook (admin)
      description: Enabling a disabled webhook clears its failure streak. The URL is validated again on every save.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                include_content: { type: boolean }
                allow_http: { type: boolean }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook and its delivery log (admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhooks/{id}/test:
    post:
      tags: [Webhooks]
      summary: Send a test message (admin)
      description: Queues a `webhook.test` delivery. It works on a disabled webhook and does not count towards the failure streak.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [delivery]
                properties:
                  delivery: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: Delivery log of a webhook (admin)
      description: Newest first, kept for 14 days.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: before
          in: query
          description: The `next_before` of the previous page.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, next_before]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  next_before: { type: string, format: uuid, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhooks/{id}/deliveries/{deliveryId}/resend:
    post:
      tags: [Webhooks]
      summary: Send a delivery again (admin)
      description: Creates a new delivery for the same event; the payload is built from the current data.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [delivery]
                properties:
                  delivery: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs:
    get:
      tags: [Operations]
      summary: Failed and retrying background jobs (admin)
      description: The newest 100 jobs that are retrying or have failed for good.
      responses:
        "200":
          description: Jobs with a shortened, credential-free last error.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /jobs/{id}/retry:
    post:
      tags: [Operations]
      summary: Run a job again now (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The job, scheduled again.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /raw-messages:
    get:
      tags: [Operations]
      summary: Stored mail that could not be processed (admin)
      description: Raw messages whose parsing failed or was skipped, with the reason.
      responses:
        "200":
          description: The newest 100.
          content:
            application/json:
              schema:
                type: object
                required: [raw_messages]
                properties:
                  raw_messages:
                    type: array
                    items:
                      type: object
                      required: [id, mailbox_id, mailbox_name, parse_status, reason, size_bytes, received_at]
                      properties:
                        id: { type: string, format: uuid }
                        mailbox_id: { type: string, format: uuid }
                        mailbox_name: { type: string }
                        parse_status: { type: string, enum: [failed, skipped] }
                        reason: { type: string }
                        size_bytes: { type: integer }
                        received_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /raw-messages/{id}/retry:
    post:
      tags: [Operations]
      summary: Parse a stored message again (admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Queued. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit:
    get:
      tags: [Audit]
      summary: Audit log (admin)
      description: Newest first, 50 per page, with keyset pagination.
      parameters:
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditActor" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
        - name: before
          in: query
          description: The `next_before` of the previous page.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries, next_before]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  next_before: { type: integer, format: int64, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /audit/export:
    get:
      tags: [Audit]
      summary: Export the audit log as CSV (admin)
      description: Streams the filtered log. The export is itself audited.
      parameters:
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditActor" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
      responses:
        "200":
          description: CSV with a header row.
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /events:
    get:
      tags: [Realtime]
      summary: Stream of change events (browser session only)
      description: |
        Server-sent events, one stream per browser tab, at most 10 per user. Every `data:` line is
        a JSON object with a `type` and identifiers only, never content; clients refetch through
        the API. Types: `message.created`, `message.updated`, `conversation.updated`,
        `notification` (only sent to the user it is for), `presence` and `resync`. `resync` means
        events may have been missed and everything should be refetched; it is also sent after a
        `Last-Event-ID` that cannot be replayed, and when the user's mailbox access changed.
        Events for mailboxes the user cannot read are never sent. A `: ping` comment arrives every
        25 seconds.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Too many open streams (`too_many_streams`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The server is shutting down (`shutting_down`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /conversations/{id}/presence:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Realtime]
      summary: Who has the conversation open
      description: Kept in memory with a 30 second TTL. A conversation outside the caller's mailboxes answers 404.
      responses:
        "200":
          description: Current viewers, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [viewers]
                properties:
                  viewers:
                    type: array
                    items:
                      type: object
                      required: [user_id, name, typing]
                      properties:
                        user_id: { type: string, format: uuid }
                        name: { type: string }
                        typing: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Realtime]
      summary: Report that you are viewing, typing in or have left a conversation (browser session only)
      description: |
        Clients send `viewing` every 15 seconds while the conversation is open and `typing` while
        editing a reply (it lapses after 8 seconds). Limited to 120 requests a minute per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [viewing, typing, left] }
      responses:
        "204": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "429":
          description: Rate limited (`rate_limited`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /agents/online:
    get:
      tags: [Realtime]
      summary: Agents with an open event stream on this server
      responses:
        "200":
          description: Online agents, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /conversations/{id}/messages/{mid}/allow-images:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: mid
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      summary: Show the remote images of a message
      description: |
        `scope=once` only returns a render URL that shows the images for that view and needs read
        access. `sender` and `domain` add the sender's address or `@domain` to the mailbox's
        allowlist (audited) and need write access; a reader without it gets 403. Images that are
        allowed are fetched through a signing proxy, never directly by the browser.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [once, sender, domain] }
      responses:
        "200":
          description: The URL to load in the message frame.
          content:
            application/json:
              schema:
                type: object
                required: [render_url]
                properties:
                  render_url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /attachments/{id}/download:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Conversations]
      summary: Download an attachment
      description: |
        Always served as a download (`Content-Disposition: attachment`, `nosniff`, CSP `sandbox`).
        The type comes from content sniffing; files flagged `dangerous` in the conversation are
        served as `application/octet-stream`. An attachment the virus scanner flagged answers 403
        `attachment_infected`. Outside the caller's mailboxes it answers 404.
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      description: |
        Newest activity first, keyset paginated. `status=snoozed` shows open and waiting
        conversations that are snoozed; every other status view hides conversations whose
        `snoozed_until` is in the future. `mailbox_id`, `team_id` and `label_id` may be repeated to
        match any of the values. Filters of different kinds must all match.
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [mine, unassigned, all], default: all } }
        - { name: status, in: query, schema: { type: string, enum: [open, waiting, closed, spam, snoozed], default: open } }
        - { name: mailbox_id, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: team_id, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: label_id, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - name: assignee
          in: query
          description: "`me`, `none` or a user id. Combined with `view=mine` or `view=unassigned` a different value gives an empty list."
          schema: { type: string }
        - name: priority
          in: query
          description: Repeat to allow several priorities.
          schema: { type: array, items: { type: string, enum: [none, low, normal, high, urgent] } }
          style: form
          explode: true
        - { name: has_attachment, in: query, schema: { type: boolean } }
        - { name: after, in: query, description: "First day to include, by last message (UTC).", schema: { type: string, format: date } }
        - { name: before, in: query, description: "Day to stop before, by last message (UTC); this day is not included.", schema: { type: string, format: date } }
        - { name: contact_id, in: query, schema: { type: string, format: uuid } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of conversations.
          content:
            application/json:
              schema:
                type: object
                required: [conversations, next_cursor]
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      description: Summary of a conversation, including `version`, `snoozed_until` and `labels`.
                      required: [id, status, priority, version, snoozed_until, labels]
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [open, waiting, closed, spam] }
                        priority: { type: string, enum: [none, low, normal, high, urgent] }
                        version: { type: integer }
                        snoozed_until: { type: string, format: date-time, nullable: true }
                        labels:
                          type: array
                          items: { $ref: "#/components/schemas/LabelRef" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

    post:
      tags: [Conversations]
      summary: Start a conversation by sending a message
      description: |
        Sends a new outgoing message from a mailbox you may write to. `mailbox_id`, `subject`, `to`
        and `idempotency_key` are required. The message is queued and can be cancelled until
        `undo_until`. Repeating a request with the same `idempotency_key` returns the earlier result
        with 200. Errors: `mailbox_disabled` (422), `idempotency_conflict` (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: Queued.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SentMessage" }
                  - type: object
                    required: [conversation_id]
                    properties:
                      conversation_id: { type: string, format: uuid }
        "200":
          description: The idempotency key was used before; the earlier message is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Code `idempotency_conflict`. The key belongs to another message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
  /conversations/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Conversations]
      summary: Get a conversation with its messages
      responses:
        "200":
          description: The conversation, its messages, its contact and the customer's satisfaction rating (`csat`, null until rated).
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Conversations]
      summary: Change status, priority, assignment or snooze
      description: |
        All fields are optional and applied in one transaction. `null` clears
        `assignee_user_id`, `assignee_team_id` and `snoozed_until`. The assignee must have
        write access to the conversation's mailbox (`assignee_no_access`), the team must have
        access to it (`team_no_access`). Closed and spam conversations cannot be snoozed
        (`not_snoozable`), and closing or marking as spam ends a snooze. With
        `expected_version` the change only applies when the conversation still has that
        version; otherwise 409 `version_conflict` with `error.current_version`.
        Readonly users get 403 for every id; a mailbox you can read but not write also gives 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, waiting, closed, spam] }
                priority: { type: string, enum: [none, low, normal, high, urgent] }
                assignee_user_id: { type: string, format: uuid, nullable: true }
                assignee_team_id: { type: string, format: uuid, nullable: true }
                snoozed_until: { type: string, format: date-time, nullable: true }
                expected_version: { type: integer }
      responses:
        "200":
          description: Applied. `version` is the conversation's version afterwards.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The conversation changed since `expected_version` (`version_conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /conversations/{id}/labels:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [Conversations]
      summary: Replace the labels of a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_ids]
              properties:
                label_ids:
                  type: array
                  maxItems: 100
                  items: { type: string, format: uuid }
                expected_version: { type: integer }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The conversation changed since `expected_version` (`version_conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /conversations/bulk:
    post:
      tags: [Conversations]
      summary: Change up to 500 conversations at once
      description: |
        Each conversation is changed in its own transaction, so one failure does not undo the
        others. The response lists a result per id, in request order (unparsable ids first).
        Codes: `not_found`, `forbidden`, `assignee_no_access`, `team_no_access`,
        `not_snoozable`, `invalid_id`, `internal`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
                action:
                  type: object
                  description: At least one field.
                  properties:
                    status: { type: string, enum: [open, waiting, closed, spam] }
                    priority: { type: string, enum: [none, low, normal, high, urgent] }
                    assignee_user_id: { type: string, format: uuid, nullable: true }
                    assignee_team_id: { type: string, format: uuid, nullable: true }
                    snooze_until: { type: string, format: date-time, nullable: true }
                    add_label_ids: { type: array, items: { type: string, format: uuid } }
                    remove_label_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Per-conversation results.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        code: { type: string }
                        version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /trash:
    get:
      tags: [Conversations]
      summary: List conversations in the trash
      description: |
        Requires `conversations.delete`. Lists the trash of the mailboxes the user may write,
        most recently deleted first. A conversation in the trash is left out of every other list,
        count, search, rule and SLA, and `GET /conversations/{id}` answers 404 for it (see
        `GET /trash/{id}`). The trash
        is emptied by the retention setting `trash_days` (30 by default).
      parameters:
        - { name: mailbox_id, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [conversations, next_cursor]
                properties:
                  conversations:
                    type: array
                    items: { $ref: "#/components/schemas/TrashedConversation" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Conversations]
      summary: Move conversations to the trash
      description: |
        Requires `conversations.delete` and write access to each conversation's mailbox. Each
        conversation is moved in its own transaction and gets a `deleted` event. Codes:
        `not_found`, `forbidden`, `invalid_id`, `internal`.
      requestBody: { $ref: "#/components/requestBodies/TrashIDs" }
      responses:
        "200": { $ref: "#/components/responses/BulkResults" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /trash/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Conversations]
      summary: View a conversation in the trash
      description: |
        Requires `conversations.delete` and write access to the mailbox. The same content as
        `GET /conversations/{id}`, with `can_write` false, plus the timeline and who deleted it.
        The render and attachment download routes serve the messages of trashed conversations to
        the same users. 404 when the conversation is not in the trash.
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                type: object
                required: [conversation, messages, contact, csat, events, deleted_at, deleted_by]
                description: The fields of `GET /conversations/{id}`, plus the ones below.
                properties:
                  events:
                    type: array
                    description: As in `GET /conversations/{id}/events`.
                    items: { type: object }
                  deleted_at: { type: string, format: date-time }
                  deleted_by: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /trash/restore:
    post:
      tags: [Conversations]
      summary: Take conversations out of the trash
      description: |
        Requires `conversations.delete`. Each restored conversation gets a `restored` event. A
        conversation that is not in the trash of a mailbox the user may write is `not_found`.
      requestBody: { $ref: "#/components/requestBodies/TrashIDs" }
      responses:
        "200": { $ref: "#/components/responses/BulkResults" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /trash/purge:
    post:
      tags: [Conversations]
      summary: Delete conversations in the trash for good
      description: |
        Requires `conversations.delete`. Messages, attachments and stored mail go; this cannot be
        undone. Audited as `conversations.purged`. Codes: `not_found` (not in the trash of a
        writable mailbox), `sending` (mail of it is still being sent; try again later),
        `invalid_id`.
      requestBody: { $ref: "#/components/requestBodies/TrashIDs" }
      responses:
        "200": { $ref: "#/components/responses/BulkResults" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /trash/empty:
    post:
      tags: [Conversations]
      summary: Empty the trash
      description: |
        Requires `conversations.delete`. Deletes for good everything in the trash of the mailboxes
        the user may write, or of `mailbox_id` only; conversations with mail still being sent stay.
        Audited as `conversations.purged`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mailbox_id: { type: string, format: uuid }
      responses:
        "200":
          description: How many conversations were deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /blocked-senders:
    get:
      tags: [Conversations]
      summary: List blocked senders
      description: |
        Requires `conversations.delete`; lists the entries of the mailboxes the user may write.
        A new conversation whose sender matches an entry of its mailbox starts as spam, without
        rules, auto-assignment or auto-reply, and its `created` event has `blocked_sender: true`.
        Mail that joins an existing conversation is not affected.
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                required: [blocked_senders, mailboxes]
                properties:
                  blocked_senders:
                    type: array
                    items: { $ref: "#/components/schemas/BlockedSender" }
                  mailboxes:
                    type: array
                    description: The mailboxes the user may add entries to.
                    items: { type: object, properties: { id: { type: string }, name: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Conversations]
      summary: Block a sender address or domain for a mailbox
      description: |
        Requires `conversations.delete` and write access to the mailbox (404 otherwise). `pattern`
        is an address or a domain (`example.com` or `@example.com`); it is stored in lower case
        without the `@`. A domain matches that exact domain, not its subdomains. Blocking what is
        already blocked answers 200 with the existing entry. Audited as `blocklist.added`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_id, pattern]
              properties:
                mailbox_id: { type: string, format: uuid }
                pattern: { type: string, maxLength: 254 }
      responses:
        "200":
          description: Already blocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedSender" }
        "201":
          description: Blocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedSender" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /blocked-senders/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    delete:
      tags: [Conversations]
      summary: Unblock a sender
      description: Requires `conversations.delete` and write access to the entry's mailbox. Audited as `blocklist.removed`.
      responses:
        "204": { description: Unblocked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{id}/events:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Conversations]
      summary: Timeline of status, assignment, priority, label and snooze changes
      description: Oldest first. `actor` is null for changes made by Echoo itself, such as a snooze that ran out.
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, type, created_at, actor, user, data]
                      properties:
                        id: { type: string, format: uuid }
                        type:
                          type: string
                          enum: [status_changed, resolved, reopened, assigned, unassigned, team_assigned, priority_changed, labeled, unlabeled, snoozed, woke, deleted, restored]
                        created_at: { type: string, format: date-time }
                        actor: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
                        user:
                          type: object
                          nullable: true
                          description: The assignee, for assigned and unassigned.
                          properties: { id: { type: string }, name: { type: string } }
                        data: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assignees:
    get:
      tags: [Conversations]
      summary: People and teams a conversation of a mailbox can be assigned to
      description: People with write access to the mailbox, and teams with any access to it.
      parameters:
        - { name: mailbox_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The candidates.
          content:
            application/json:
              schema:
                type: object
                required: [users, teams]
                properties:
                  users:
                    type: array
                    items: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  teams:
                    type: array
                    items: { type: object, properties: { id: { type: string }, name: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /labels:
    get:
      tags: [Conversations]
      summary: List labels
      responses:
        "200":
          description: All labels, by name.
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Conversations]
      summary: Create a label (admin)
      description: Audited as `label.created`. Names are unique regardless of case; a duplicate gives 422 with `fields.name` set to `taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color_token]
              properties:
                name: { type: string, maxLength: 50 }
                color_token: { type: string, enum: [slate, blue, teal, green, amber, orange, red, violet] }
                description: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [label]
                properties:
                  label: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /labels/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Conversations]
      summary: Change a label (admin)
      description: Absent fields stay as they are. Audited as `label.updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                color_token: { type: string, enum: [slate, blue, teal, green, amber, orange, red, violet] }
                description: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [label]
                properties:
                  label: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Conversations]
      summary: Delete a label (admin)
      description: The label is removed from every conversation. Audited as `label.deleted`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /search:
    get:
      tags: [Conversations]
      summary: Search conversations
      description: |
        Full-text search over messages, plus subject and contact matches, limited to the mailboxes
        you may read. Results are grouped per conversation, best match first, then newest.
        The query mixes free text (`"exact phrase"` supported) and filters, in Dutch or English:
        `status:` (`open`, `waiting`, `closed`, `spam`, `snoozed`), `van:`/`from:` (address, `@domain` or
        part of an address), `aan:`/`to:`, `mailbox:`, `label:`, `toegewezen:`/`assignee:` (`me`, `none` or a name),
        `team:`, `prioriteit:`/`priority:`, `heeft:bijlage`/`has:attachment`, `voor:`/`before:` and
        `na:`/`after:` (`YYYY-MM-DD`, UTC; `after` includes the day, `before` does not) and `#1234` for a
        conversation number. Values with spaces are quoted: `label:"grote klant"`. A token that is
        not a valid filter is searched as text. Mailbox, label, team and person names match by prefix.
        A `snippet` holds plain text with matches wrapped in U+27E6 and U+27E7; it is empty when only the
        subject or contact matched.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of results. An empty query gives an empty page.
          content:
            application/json:
              schema:
                type: object
                required: [results, next_cursor]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [conversation, snippet]
                      properties:
                        conversation: { $ref: "#/components/schemas/Conversation" }
                        snippet: { type: string }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429":
          description: Too many searches; code `rate_limited`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /saved-views:
    get:
      tags: [Conversations]
      summary: List saved views
      description: |
        Your personal views and the shared views you may see (shared with everyone or with one of your
        teams; admins see all shared views). `open_count` counts the view's conversations, capped at 1000,
        and is null when the view's status is not open.
      responses:
        "200":
          description: The views, personal first.
          content:
            application/json:
              schema:
                type: object
                required: [views]
                properties:
                  views:
                    type: array
                    items: { $ref: "#/components/schemas/SavedView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Conversations]
      summary: Create a saved view
      description: |
        `scope` is `personal`, `everyone` or `team` (with `team_id`). Sharing is for admins; others get 403.
        Names are unique per owner, or among shared views, regardless of case; a duplicate gives 422
        with `fields.name` set to `taken`. Unknown filter fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, filters, scope]
              properties:
                name: { type: string, maxLength: 60 }
                filters: { $ref: "#/components/schemas/SavedViewFilters" }
                scope: { type: string, enum: [personal, everyone, team] }
                team_id: { type: string, format: uuid }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [view]
                properties:
                  view: { $ref: "#/components/schemas/SavedView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /saved-views/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Conversations]
      summary: Change a saved view
      description: |
        Absent fields stay as they are. Personal views can be changed by their owner, shared views by
        admins. A view you may not see is 404; one you may see but not change is 403. Changing `scope`
        to `everyone` or `team` is an admin action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                filters: { $ref: "#/components/schemas/SavedViewFilters" }
                position: { type: integer, minimum: 0, maximum: 10000 }
                scope: { type: string, enum: [personal, everyone, team] }
                team_id: { type: string, format: uuid }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [view]
                properties:
                  view: { $ref: "#/components/schemas/SavedView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Conversations]
      summary: Delete a saved view
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/login:
    post:
      tags: [Account]
      summary: Sign in
      description: |
        Public. Starts a browser session and sets the session cookie. When `mfa_required` is true the
        session is pending and only `POST /auth/mfa` and `POST /auth/logout` work until the code is
        verified. Rate limited per IP address; a locked account answers like a wrong password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [mfa_required, csrf_token]
                properties:
                  mfa_required: { type: boolean }
                  csrf_token: { type: string }
        "401":
          description: Code `invalid_credentials`, also for a temporarily locked account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many attempts from this address. Code `rate_limited`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/sso:
    get:
      tags: [Account]
      summary: Single sign-on availability
      description: |
        Public. Tells the login page whether to offer single sign-on and whether password sign-in is
        switched off (`required`; the owner can always use a password). The browser flow itself is
        `GET /auth/sso/start` and `GET /auth/sso/callback` outside this API: they redirect to the
        identity provider and back to the login page, with `?sso_error=<reason>` on failure.
      security: []
      responses:
        "200":
          description: The public part of the SSO settings.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, label, required]
                properties:
                  enabled: { type: boolean }
                  label: { type: string, description: "The button label, empty when disabled." }
                  required: { type: boolean }
  /auth/mfa:
    post:
      tags: [Account]
      summary: Verify the two-factor code of a pending session
      description: |
        A pending 2FA session is enough. Needs a browser session. The code is a TOTP code or a
        recovery code. Replaces the session token and returns a new CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Fully signed in.
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: { type: string }
        "401":
          description: No session, or code `invalid_code` when the code is wrong or already used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Code `mfa_not_pending`. The session is already fully signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many attempts from this address. Code `rate_limited`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      tags: [Account]
      summary: Sign out
      description: A pending 2FA session is enough. Needs a browser session. Ends the current session and clears the cookie.
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me:
    get:
      tags: [Account]
      summary: The signed-in user
      description: |
        Also works while a password change or two-factor enrollment is still required, so clients can
        see why other routes answer 403. Returns the CSRF token of the session.
      responses:
        "200":
          description: The user and account state.
          content:
            application/json:
              schema:
                type: object
                required: [user, permissions, custom_role_name, csrf_token, must_change_password, mfa_enrollment_required, recovery_codes_remaining]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  permissions:
                    type: array
                    description: What the user may do, in the order of `GET /roles`.
                    items: { type: string }
                  custom_role_name: { type: string, description: "Name of the custom role, empty for the built-in roles." }
                  csrf_token: { type: string }
                  must_change_password: { type: boolean }
                  mfa_enrollment_required: { type: boolean }
                  recovery_codes_remaining: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [Account]
      summary: Change your name or theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                theme: { type: string, enum: [system, light, dark] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/password:
    post:
      tags: [Account]
      summary: Change your password
      description: |
        Needs a browser session. Works while a password change is required. The session cookie is
        replaced and the response carries a new CSRF token. Validation codes: `too_short`, `too_long`,
        `same_as_current` on `new_password`, `incorrect` on `current_password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/totp/setup:
    post:
      tags: [Account]
      summary: Start two-factor enrollment
      description: Needs a browser session. Works while enrollment is required. Answers 409 when two-factor authentication is already enabled.
      responses:
        "200":
          description: The TOTP secret and its otpauth URI.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri]
                properties:
                  secret: { type: string }
                  uri: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Code `mfa_already_enabled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/totp/enable:
    post:
      tags: [Account]
      summary: Finish two-factor enrollment
      description: Needs a browser session. Works while enrollment is required. The recovery codes in the response are shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, description: "A current TOTP code for the secret from setup." }
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401":
          description: Code `invalid_code`, or no valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Code `mfa_state_conflict`. Already enabled, or setup was not started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/totp/disable:
    post:
      tags: [Account]
      summary: Turn off two-factor authentication
      description: Needs a browser session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Code `mfa_state_conflict`. Two-factor authentication is not enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/recovery-codes:
    post:
      tags: [Account]
      summary: Generate new recovery codes
      description: Needs a browser session. Replaces all earlier codes; the new ones are shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: New codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Code `mfa_state_conflict`. Two-factor authentication is not enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/sessions:
    get:
      tags: [Account]
      summary: List your active sessions
      description: Needs a browser session.
      responses:
        "200":
          description: Your sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/sessions/{id}:
    delete:
      tags: [Account]
      summary: End one of your other sessions
      description: Needs a browser session. The current session cannot be ended here; use `POST /auth/logout`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Ended. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Code `current_session`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/sessions/revoke-others:
    post:
      tags: [Account]
      summary: End all your other sessions
      description: Needs a browser session.
      responses:
        "200":
          description: Number of sessions ended.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/signatures:
    get:
      tags: [Account]
      summary: List your signatures
      description: One default signature (`mailbox_id` null) and at most one per mailbox.
      responses:
        "200":
          description: Your signatures.
          content:
            application/json:
              schema:
                type: object
                required: [signatures]
                properties:
                  signatures:
                    type: array
                    items: { $ref: "#/components/schemas/Signature" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Account]
      summary: Set or clear your signature
      description: |
        Replaces the signature for the given mailbox, or the default one when `mailbox_id` is null or
        absent. An empty body removes it. The HTML is sanitized and limited to 20 KiB. Not allowed
        for read-only users.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Signature" }
      responses:
        "200":
          description: The stored signature, after sanitizing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signature" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /signatures/effective:
    get:
      tags: [Account]
      summary: The signature that applies to a mailbox
      description: Your signature for the mailbox, else your default, else the mailbox signature. Both fields are empty when none applies.
      parameters:
        - name: mailbox_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The resolved signature.
          content:
            application/json:
              schema:
                type: object
                required: [body_html, source]
                properties:
                  body_html: { type: string }
                  source: { type: string, description: "Where the signature comes from. Empty when there is none." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications:
    get:
      tags: [Account]
      summary: List your notifications
      description: Newest first, at most 50, limited to mailboxes you can read.
      parameters:
        - name: unread
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Notifications and the total unread count.
          content:
            application/json:
              schema:
                type: object
                required: [notifications, unread_count]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  unread_count: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications/read:
    post:
      tags: [Account]
      summary: Mark notifications as read
      description: Send `ids` or set `all`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                all: { type: boolean, default: false }
      responses:
        "200":
          description: The unread count after the change.
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /inbox/summary:
    get:
      tags: [Conversations]
      summary: Open conversation counts for the sidebar
      description: Counts cover the mailboxes you can read. Teams are limited to your own unless you are an admin.
      responses:
        "200":
          description: Counts per view, mailbox and team.
          content:
            application/json:
              schema:
                type: object
                required: [mailboxes, teams, counts]
                properties:
                  mailboxes:
                    type: array
                    items:
                      type: object
                      required: [id, name, email_address, open_count]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email_address: { type: string }
                        open_count: { type: integer }
                  teams:
                    type: array
                    items:
                      type: object
                      required: [id, name, open_count]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        open_count: { type: integer }
                  counts:
                    type: object
                    required: [mine, unassigned, all, unread_mine]
                    properties:
                      mine: { type: integer }
                      unassigned: { type: integer }
                      all: { type: integer }
                      unread_mine: { type: integer, description: "Open, unsnoozed conversations assigned to you that are unread for you." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /conversations/{id}/reply-defaults:
    get:
      tags: [Conversations]
      summary: Defaults for a reply
      description: Recipients, subject, sender address and undo delay for a new reply. Needs write access to the conversation.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The defaults.
          content:
            application/json:
              schema:
                type: object
                required: [to, cc, suggested_cc, subject, from, send_delay_seconds]
                properties:
                  to:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
                  cc:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
                  suggested_cc:
                    description: Senders who wrote into the thread without being a known participant of the conversation. The reply never goes to them by default; the client offers them as an optional Cc.
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
                  subject: { type: string }
                  from: { $ref: "#/components/schemas/Address" }
                  send_delay_seconds: { type: integer, format: int32 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /conversations/{id}/mentionable:
    get:
      tags: [Conversations]
      summary: Users that can be mentioned in a note
      description: Users who can read the mailbox of the conversation.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, name, email]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /conversations/{id}/replies:
    post:
      tags: [Conversations]
      summary: Reply to a conversation
      description: |
        Queues an email. `idempotency_key` is required and `html` must not be empty. Without `to`
        the recipients follow from the last message. The message can be cancelled until `undo_until`.
        Errors: `mailbox_disabled` (422), `idempotency_conflict` (409). Repeating a request with the
        same key returns the earlier result with 200. Read-only users get 403.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "200":
          description: The idempotency key was used before; the earlier message is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Code `idempotency_conflict`. The key belongs to another message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
  /conversations/{id}/replies/{messageId}/cancel:
    post:
      tags: [Conversations]
      summary: Cancel a queued reply (undo send)
      description: |
        Only your own message, and only before sending starts. Restores its attachments as uploads
        and reverts the status change the reply made. Answers 409 `too_late` when sending has begun.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [status, attachments]
                properties:
                  status: { type: string, enum: [cancelled] }
                  attachments:
                    type: array
                    items: { $ref: "#/components/schemas/Upload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Code `too_late`. The message is already being sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /conversations/{id}/forward:
    post:
      tags: [Conversations]
      summary: Forward a message
      description: |
        Send `message_id` (a message of this conversation), `to` and `idempotency_key`. The original
        text is quoted and the raw message is attached as an .eml file. `html` may be empty. Same
        errors and idempotency behavior as replies.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "200":
          description: The idempotency key was used before; the earlier message is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Code `idempotency_conflict`. The key belongs to another message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
  /conversations/{id}/notes:
    post:
      tags: [Conversations]
      summary: Add an internal note
      description: |
        The HTML is sanitized and must not be empty. Mentioned users get a notification; each must be
        able to read the mailbox, otherwise 422 `mention_no_access`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [html]
              properties:
                html: { type: string, description: "At most 500 KiB." }
                mentions:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /conversations/{id}/read:
    post:
      tags: [Conversations]
      summary: Mark a conversation as read
      description: Personal to the caller and idempotent; no realtime event is emitted. Answering or adding a note marks it read too.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Marked as read. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /conversations/{id}/unread:
    post:
      tags: [Conversations]
      summary: Mark a conversation as unread
      description: Personal to the caller and idempotent; the conversation stays unread until it is opened again.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Marked as unread. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /conversations/{id}/draft:
    get:
      tags: [Conversations]
      summary: Get your draft reply
      description: One draft per user per conversation. `draft` is null when there is none.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The draft or null.
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft:
                    nullable: true
                    allOf:
                      - { $ref: "#/components/schemas/Draft" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Conversations]
      summary: Save your draft reply
      description: Replaces the draft. The HTML is sanitized. Attachment ids that are no longer live uploads are dropped silently.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: array
                  items: { $ref: "#/components/schemas/Address" }
                cc:
                  type: array
                  items: { $ref: "#/components/schemas/Address" }
                bcc:
                  type: array
                  items: { $ref: "#/components/schemas/Address" }
                subject: { type: string }
                html: { type: string, description: "At most 500 KiB." }
                attachment_ids:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: "#/components/schemas/Draft" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Conversations]
      summary: Discard your draft reply
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Discarded, also when there was no draft. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /uploads:
    post:
      tags: [Conversations]
      summary: Upload a file to attach to a message
      description: |
        Multipart body with a `file` part. The upload belongs to you and expires (`expires_at`); it is
        consumed when you send a message with its id. Not allowed for read-only users. Errors: 413
        `file_too_large`, 422 `file` = `required` or `empty`, 422 `attachment_infected` when the virus
        scanner flags the file (it is not stored).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Code `file_too_large`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
  /uploads/{id}:
    delete:
      tags: [Conversations]
      summary: Delete one of your uploads
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /templates:
    get:
      tags: [Conversations]
      summary: List reply templates
      description: |
        Your personal templates plus the global, team and mailbox templates you can see. With
        `manage=true` (admin) every template is returned.
      parameters:
        - name: manage
          in: query
          description: Only `true` is accepted, and only for admins.
          schema: { type: boolean }
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Conversations]
      summary: Create a reply template
      description: |
        Scope `personal` is open to everyone except read-only users; `team`, `mailbox` and `global`
        need an admin. `team` needs `team_id` and `mailbox` needs `mailbox_id`. Non-personal changes
        are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/TemplateInput" }
                - type: object
                  required: [scope]
                  properties:
                    scope: { type: string, enum: [personal, team, mailbox, global] }
                    team_id: { type: string, format: uuid, nullable: true }
                    mailbox_id: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /templates/{id}:
    patch:
      tags: [Conversations]
      summary: Change a reply template
      description: Replaces name, shortcode, subject and body; scope and owner cannot change. Personal templates only by their owner, others by admins.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Conversations]
      summary: Delete a reply template
      description: Personal templates only by their owner, others by admins.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /templates/{id}/render:
    get:
      tags: [Conversations]
      summary: Fill in a template for a conversation
      description: Replaces variables from the conversation, contact, mailbox and you. Names that could not be resolved are listed in `unresolved`.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: conversation_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The rendered template.
          content:
            application/json:
              schema:
                type: object
                required: [subject, body_html, unresolved]
                properties:
                  subject: { type: string }
                  body_html: { type: string }
                  unresolved:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mailboxes:
    get:
      tags: [Mailboxes]
      summary: List mailboxes (admin)
      description: Includes disabled mailboxes. Passwords are never returned; `*_password_set` says whether one is stored.
      responses:
        "200":
          description: All mailboxes.
          content:
            application/json:
              schema:
                type: object
                required: [mailboxes]
                properties:
                  mailboxes:
                    type: array
                    items: { $ref: "#/components/schemas/Mailbox" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Mailboxes]
      summary: Create a mailbox (admin)
      description: |
        Defaults: IMAP 993 and SMTP 465 with `implicit` TLS, send delay 5 seconds. `imap_password` is
        required; `smtp_password` is required when `smtp_username` is set. Hosts on internal
        networks are refused (422 `internal_host`) unless `allow_internal_host` is set, which only the
        owner may do.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailboxInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [mailbox]
                properties:
                  mailbox: { $ref: "#/components/schemas/Mailbox" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /mailboxes/test:
    post:
      tags: [Mailboxes]
      summary: Test IMAP and SMTP settings (admin)
      description: |
        Connects with the given settings without saving. With `id`, missing fields and stored
        passwords come from that mailbox. Always answers 200 when the input is valid; failures are in
        the result `code`: `imap_auth_failed`, `imap_tls_failed`, `imap_no_inbox`,
        `imap_connect_failed`, `smtp_auth_failed`, `smtp_tls_failed`, `smtp_connect_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/MailboxInput" }
                - type: object
                  properties:
                    id: { type: string, format: uuid, description: "An existing mailbox to take defaults and stored passwords from." }
      responses:
        "200":
          description: The result of both probes.
          content:
            application/json:
              schema:
                type: object
                required: [imap, smtp]
                properties:
                  imap: { $ref: "#/components/schemas/ProbeResult" }
                  smtp: { $ref: "#/components/schemas/ProbeResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /mailboxes/{id}:
    get:
      tags: [Mailboxes]
      summary: Get a mailbox (admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema:
                type: object
                required: [mailbox]
                properties:
                  mailbox: { $ref: "#/components/schemas/Mailbox" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Mailboxes]
      summary: Change a mailbox (admin)
      description: Send only the fields to change. Omitted passwords stay as they are. Same validation as create.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailboxInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [mailbox]
                properties:
                  mailbox: { $ref: "#/components/schemas/Mailbox" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /mailboxes/{id}/disable:
    post:
      tags: [Mailboxes]
      summary: Disable a mailbox (admin)
      description: Sending from a disabled mailbox fails with 422 `mailbox_disabled`. Does nothing when it is already disabled.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema:
                type: object
                required: [mailbox]
                properties:
                  mailbox: { $ref: "#/components/schemas/Mailbox" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mailboxes/{id}/enable:
    post:
      tags: [Mailboxes]
      summary: Enable a mailbox (admin)
      description: Does nothing when it is already enabled.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema:
                type: object
                required: [mailbox]
                properties:
                  mailbox: { $ref: "#/components/schemas/Mailbox" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mailboxes/{id}/access:
    get:
      tags: [Mailboxes]
      summary: Which teams may use a mailbox (admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Team access entries.
          content:
            application/json:
              schema:
                type: object
                required: [access]
                properties:
                  access:
                    type: array
                    items: { $ref: "#/components/schemas/MailboxAccessEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Mailboxes]
      summary: Replace the team access of a mailbox (admin)
      description: Replaces the whole list. Each team may appear once. Validation codes on `access` are `invalid`, `too_many`, `unknown_team`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access]
              properties:
                access:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/MailboxAccessEntry" }
      responses:
        "204": { description: Replaced. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /mailboxes/{id}/signature:
    get:
      tags: [Mailboxes]
      summary: Get the mailbox signature (admin)
      description: Empty when none is set.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The signature.
          content:
            application/json:
              schema:
                type: object
                required: [body_html]
                properties:
                  body_html: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Mailboxes]
      summary: Set or clear the mailbox signature (admin)
      description: An empty body removes the signature. The HTML is sanitized and limited to 20 KiB.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_html]
              properties:
                body_html: { type: string }
      responses:
        "200":
          description: The stored signature, after sanitizing.
          content:
            application/json:
              schema:
                type: object
                required: [body_html]
                properties:
                  body_html: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /users:
    get:
      tags: [Users and teams]
      summary: List users (admin)
      description: Includes deactivated users.
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users and teams]
      summary: Create a user (admin)
      description: |
        The server generates a temporary password, shown once; the user must change it at first
        sign-in. Needs `users.manage`. Give either `role` (built-in) or `custom_role_id`. Only the owner
        creates admins or hands out roles that grant `users.manage` or `settings.manage`; nobody grants
        permissions they lack (403 `forbidden`). Validation code `taken` on `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string }
                name: { type: string, maxLength: 200 }
                role: { $ref: "#/components/schemas/Role" }
                custom_role_id: { type: string, format: uuid }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [user, temporary_password]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  temporary_password: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /users/{id}:
    patch:
      tags: [Users and teams]
      summary: Change a user (admin)
      description: |
        Send only the fields to change; `role` and `custom_role_id` are mutually exclusive. Deactivating
        a user ends all their sessions. Answers 403 when you may not manage that user or assign that
        role: the owner manages everybody, others only users whose permissions they hold in full and who
        cannot manage access themselves.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                role: { $ref: "#/components/schemas/Role" }
                custom_role_id: { type: string, format: uuid }
                deactivated: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /users/{id}/reset-password:
    post:
      tags: [Users and teams]
      summary: Reset the password of a user (admin)
      description: Returns a new temporary password, shown once. Answers 403 when you may not manage that user.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password]
                properties:
                  temporary_password: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/reset-mfa:
    post:
      tags: [Users and teams]
      summary: Remove two-factor authentication of a user (admin)
      description: Answers 403 when you may not manage that user.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /teams:
    get:
      tags: [Users and teams]
      summary: List teams (admin)
      responses:
        "200":
          description: All teams.
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams:
                    type: array
                    items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users and teams]
      summary: Create a team (admin)
      description: Validation code `taken` on `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Created. `member_count` is 0.
          content:
            application/json:
              schema:
                type: object
                required: [team]
                properties:
                  team: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /teams/{id}:
    patch:
      tags: [Users and teams]
      summary: Rename a team (admin)
      description: Validation code `taken` on `name`. The `member_count` in the response is not filled in and is 0; list teams for counts.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                required: [team]
                properties:
                  team: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Users and teams]
      summary: Delete a team (admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /teams/{id}/members:
    get:
      tags: [Users and teams]
      summary: List the members of a team (admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: User ids.
          content:
            application/json:
              schema:
                type: object
                required: [user_ids]
                properties:
                  user_ids:
                    type: array
                    items: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users and teams]
      summary: Replace the members of a team (admin)
      description: Replaces the whole list. Validation codes on `user_ids` are `invalid`, `too_many`, `unknown_user`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  maxItems: 1000
                  items: { type: string, format: uuid }
      responses:
        "204": { description: Replaced. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /settings/security:
    get:
      tags: [Users and teams]
      summary: Security settings (admin)
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Users and teams]
      summary: Change the security settings (admin)
      description: When `require_mfa` is true, users without two-factor authentication must enroll before they can use the rest of the API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecuritySettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /roles:
    get:
      tags: [Users and teams]
      summary: List roles (users.manage)
      description: The permission list, the four built-in roles with their permissions, and the custom roles.
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                type: object
                required: [permissions, builtin, roles]
                properties:
                  permissions:
                    type: array
                    description: Every permission key, in display order.
                    items: { type: string }
                  builtin:
                    type: array
                    items:
                      type: object
                      required: [id, permissions]
                      properties:
                        id: { $ref: "#/components/schemas/Role" }
                        permissions:
                          type: array
                          items: { type: string }
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/CustomRole" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users and teams]
      summary: Create a custom role (users.manage)
      description: |
        A user can only grant permissions they hold, and only the owner creates roles that grant
        `users.manage` or `settings.manage` (403 `forbidden`). A permission needs its base permission:
        `conversations.write`, `contacts.write`, `contacts.export`, `contacts.import` and `contacts.erase`
        need the matching `.read`; `conversations.assign` and `conversations.delete` need
        `conversations.write`; `contacts.moderate` needs `contacts.write`; `reports.view_all_agents`
        needs `reports.view`; `kb.manage` needs `kb.write`
        (422 `validation_failed`, `permissions` = `requires_<permission>`). Validation code `taken` on `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name: { type: string, maxLength: 60 }
                description: { type: string, maxLength: 300 }
                permissions:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: "#/components/schemas/CustomRole" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /roles/{id}:
    patch:
      tags: [Users and teams]
      summary: Change a custom role (users.manage)
      description: |
        Send only the fields to change. Changed permissions apply to every user with the role
        immediately. The same limits as on creation apply to the old and the new list.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                description: { type: string, maxLength: 300 }
                permissions:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: "#/components/schemas/CustomRole" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Users and teams]
      summary: Delete a custom role (users.manage)
      description: Answers 409 `role_in_use` while users have the role or it is the SSO default role.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Code `role_in_use`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /settings/sso:
    get:
      tags: [Users and teams]
      summary: Single sign-on settings (owner)
      description: The client secret is write-only; `client_secret_set` says whether one is stored.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Users and teams]
      summary: Change the single sign-on settings (owner)
      description: |
        OpenID Connect with an authorization code and PKCE. When `enabled`, the issuer's discovery
        document is fetched through the SSRF-guarded client and must answer (422 `issuer_url` =
        `unreachable` or `insecure`). `client_secret` is only stored when sent. `required` switches
        password sign-in off for everybody except the owner. `auto_provision` needs at least one allowed
        domain; new users get `default_role` (`agent` or `readonly`) or a custom role without
        `users.manage`/`settings.manage`. `allow_internal_issuer` permits a provider on a private
        network over plain HTTP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOSettingsInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /settings/email:
    get:
      tags: [Users and teams]
      summary: Outgoing email settings (admin)
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Users and teams]
      summary: Change the outgoing email settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /mailboxes/oauth/providers:
    get:
      tags: [Mailboxes]
      summary: OAuth providers that are configured (admin)
      description: |
        Providers without client credentials in the environment are not listed. `redirect_uri` is the
        address the admin registers with the provider (`ECHOO_BASE_URL` plus `/oauth/callback/{provider}`).
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required: [id, name, redirect_uri]
                      properties:
                        id: { type: string, enum: [google, microsoft] }
                        name: { type: string }
                        redirect_uri: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /mailboxes/oauth/{provider}/start:
    get:
      tags: [Mailboxes]
      summary: Start connecting a Google or Microsoft mailbox (admin)
      description: |
        Needs a browser session, not an API token. Returns the provider's authorization URL; the
        browser goes there and comes back to `/oauth/callback/{provider}`, which creates the mailbox
        (or updates the one named by `mailbox_id`, which must belong to the same account) and redirects
        to the mailbox settings. The state is encrypted, expires after 10 minutes and is bound to the
        session; the flow uses PKCE (S256).
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, microsoft] } }
        - { name: mailbox_id, in: query, required: false, schema: { type: string, format: uuid }, description: Reconnect this mailbox. }
        - { name: name, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Name of a new mailbox. Defaults to the email address. }
      responses:
        "200":
          description: The URL to send the browser to.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /settings/system-mail:
    get:
      tags: [Users and teams]
      summary: Whether Echoo can send system email (admin)
      description: |
        System mail (invitations, password resets, notification emails) is sent through the mailbox in
        `ECHOO_SYSTEM_MAILBOX` or the relay in `ECHOO_SMTP_URL`.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [available, source]
                properties:
                  available: { type: boolean }
                  source: { type: string, enum: [mailbox, smtp, ""] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /invitations:
    post:
      tags: [Users and teams]
      summary: Invite a user by email (admin)
      description: |
        Creates the user in the invited state and emails a link (72 hours, single use) where they choose
        a password. Answers 409 `system_mail_unavailable` when system mail is not configured; use
        `POST /users` for a temporary password then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string }
                name: { type: string, maxLength: 200 }
                role: { $ref: "#/components/schemas/Role" }
                custom_role_id: { type: string, format: uuid }
                team_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Code `system_mail_unavailable`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
  /users/{id}/invitation/resend:
    post:
      tags: [Users and teams]
      summary: Send a pending invitation again (admin)
      description: Replaces the earlier link. Answers 404 `link_invalid` when the user is not invited.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Sent. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Code `system_mail_unavailable`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /users/{id}/invitation:
    delete:
      tags: [Users and teams]
      summary: Revoke a pending invitation (admin)
      description: Deletes the invited user and voids the link.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /invitations/{token}:
    get:
      tags: [Account]
      summary: Look at an invitation link
      description: Public. Rate limited per IP address. Answers 404 `link_invalid` for an unknown, used, expired or revoked link.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkInfo" }
        "404": { description: "Code `link_invalid`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Code `rate_limited`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /invitations/{token}/accept:
    post:
      tags: [Account]
      summary: Accept an invitation
      description: |
        Public. Sets the name and password, consumes the link and signs the user in (session cookie).
        The password must be 12 to 128 characters.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, maxLength: 200 }
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: { type: string }
        "404": { description: "Code `link_invalid`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { description: "Code `rate_limited`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/password-reset:
    post:
      tags: [Account]
      summary: Request a password reset link
      description: |
        Public. Answers 202 whether or not the address belongs to an account. The link is valid for 30
        minutes and works once. Rate limited per IP address (429) and per account (silently). Answers
        409 `system_mail_unavailable` when system mail is not configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202": { description: Accepted. }
        "409": { description: "Code `system_mail_unavailable`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Code `rate_limited`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/password-reset/{token}:
    get:
      tags: [Account]
      summary: Look at a password reset link
      description: Public. Answers 404 `link_invalid` for an unknown, used or expired link.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The account the link is for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkInfo" }
        "404": { description: "Code `link_invalid`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Code `rate_limited`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [Account]
      summary: Set a new password with a reset link
      description: |
        Public. Consumes the link, sets the password, ends every session of the account and lifts a
        login lockout. It does not sign in: two-factor authentication still applies at the next login.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Password changed. }
        "404": { description: "Code `link_invalid`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { description: "Code `rate_limited`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /me/notification-settings:
    get:
      tags: [Account]
      summary: Email notification settings of the signed-in user
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [email, system_mail_available]
                properties:
                  email: { $ref: "#/components/schemas/EmailNotificationSettings" }
                  system_mail_available: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [Account]
      summary: Change the email notification settings
      description: Opt in per kind. The email says who did what and links to the conversation; it holds no message content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailNotificationSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { $ref: "#/components/schemas/EmailNotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/Validation" }

  /rules:
    get:
      tags: [Automation]
      summary: List automation rules (admin)
      description: In evaluation order.
      responses:
        "200":
          description: All rules by position.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Automation]
      summary: Create an automation rule (admin)
      description: |
        Conditions and actions are checked against a closed schema; unknown fields and values are
        rejected with 422 and `fields` keyed by path, such as `actions.0.label_id`. The rule goes
        last in the order. Audited as `automation.rule_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [rule]
                properties:
                  rule: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /rules/order:
    put:
      tags: [Automation]
      summary: Set the order of the rules (admin)
      description: |
        The list must contain every rule exactly once. When the set of rules changed in the
        meantime the answer is 409 `rules_changed`. Audited as `automation.rules_reordered`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204": { description: Reordered. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The set of rules changed; reload the list., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }

  /rules/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Automation]
      summary: Change an automation rule (admin)
      description: Absent fields stay as they are; the result is validated as a whole. Audited as `automation.rule_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [rule]
                properties:
                  rule: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Automation]
      summary: Delete an automation rule (admin)
      description: Its run log goes with it. Audited as `automation.rule_deleted`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /rules/{id}/runs:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Automation]
      summary: Run log of a rule (admin)
      description: Every evaluation, matched or not, newest first. Runs are kept for 30 days.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: The most recent runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/RuleRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /business-hours:
    get:
      tags: [Automation]
      summary: List business hours (admin)
      responses:
        "200":
          description: All schedules, the default first.
          content:
            application/json:
              schema:
                type: object
                required: [business_hours]
                properties:
                  business_hours:
                    type: array
                    items: { $ref: "#/components/schemas/BusinessHours" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Automation]
      summary: Create a business hours schedule (admin)
      description: The first schedule becomes the workspace default. Audited as `automation.business_hours_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessHoursInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [business_hours]
                properties:
                  business_hours: { $ref: "#/components/schemas/BusinessHours" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /business-hours/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Automation]
      summary: Change a business hours schedule (admin)
      description: |
        Absent fields stay as they are. The default cannot be switched off directly; make another
        schedule the default instead. Audited as `automation.business_hours_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessHoursInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [business_hours]
                properties:
                  business_hours: { $ref: "#/components/schemas/BusinessHours" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Automation]
      summary: Delete a business hours schedule (admin)
      description: |
        The default cannot be deleted (422) and neither can a schedule an SLA policy uses (409
        `in_use`). Audited as `automation.business_hours_deleted`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: An SLA policy uses these hours., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }

  /sla-policies:
    get:
      tags: [Automation]
      summary: List SLA policies (admin)
      responses:
        "200":
          description: All policies by name.
          content:
            application/json:
              schema:
                type: object
                required: [sla_policies]
                properties:
                  sla_policies:
                    type: array
                    items: { $ref: "#/components/schemas/SlaPolicy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Automation]
      summary: Create an SLA policy (admin)
      description: At least one target is required. Audited as `automation.sla_policy_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaPolicyInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [sla_policy]
                properties:
                  sla_policy: { $ref: "#/components/schemas/SlaPolicy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /sla-policies/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Automation]
      summary: Change an SLA policy (admin)
      description: |
        Absent fields stay as they are; null clears a target or the business hours. Conversations
        keep the deadlines they already have. Audited as `automation.sla_policy_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaPolicyInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [sla_policy]
                properties:
                  sla_policy: { $ref: "#/components/schemas/SlaPolicy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Automation]
      summary: Delete an SLA policy (admin)
      description: Conversations under the policy stop being tracked. Audited as `automation.sla_policy_deleted`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assignment:
    get:
      tags: [Automation]
      summary: Auto-assignment settings (admin)
      description: Per mailbox the assignment mode, default SLA policy and business hours, and per agent the capacity, availability and current open load.
      responses:
        "200":
          description: Mailboxes and agents.
          content:
            application/json:
              schema:
                type: object
                required: [mailboxes, agents]
                properties:
                  mailboxes:
                    type: array
                    items: { $ref: "#/components/schemas/MailboxAutomation" }
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /mailboxes/{id}/automation:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [Automation]
      summary: Set automation options of a mailbox (admin)
      description: Replaces all three options; null clears the SLA policy or business hours. Audited as `automation.mailbox_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auto_assign_mode]
              properties:
                auto_assign_mode: { type: string, enum: [off, round_robin, balanced] }
                default_sla_policy_id: { type: string, format: uuid, nullable: true }
                business_hours_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [mailbox]
                properties:
                  mailbox: { $ref: "#/components/schemas/MailboxAutomation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /users/{id}/capacity:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [Automation]
      summary: Set the capacity of an agent (admin)
      description: The most open conversations auto-assignment gives this agent; null means no limit. Audited as `automation.capacity_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_open]
              properties:
                max_open: { type: integer, minimum: 1, maximum: 10000, nullable: true }
      responses:
        "204": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /settings/automation:
    get:
      tags: [Automation]
      summary: Workspace automation settings (admin)
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Automation]
      summary: Change workspace automation settings (admin)
      description: Audited as `automation.settings_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /me/availability:
    put:
      tags: [Automation]
      summary: Set your availability
      description: Only `online` agents receive automatically assigned conversations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability: { type: string, enum: [online, busy, offline] }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [availability]
                properties:
                  availability: { type: string, enum: [online, busy, offline] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/Validation" }

  /macros:
    get:
      tags: [Automation]
      summary: List macros
      description: Your personal macros and the workspace macros.
      responses:
        "200":
          description: Workspace macros first, then personal ones, each by name.
          content:
            application/json:
              schema:
                type: object
                required: [macros]
                properties:
                  macros:
                    type: array
                    items: { $ref: "#/components/schemas/Macro" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Automation]
      summary: Create a macro
      description: |
        Personal macros may be created by anyone who can change conversations; workspace macros
        (`scope` global) by admins. Macros accept the rule actions except `auto_reply`. Audited as
        `automation.macro_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope, actions]
              properties:
                name: { type: string, maxLength: 100 }
                scope: { type: string, enum: [personal, global] }
                actions: { type: array, items: { $ref: "#/components/schemas/RuleAction" } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [macro]
                properties:
                  macro: { $ref: "#/components/schemas/Macro" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /macros/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Automation]
      summary: Change a macro
      description: Only the owner changes a personal macro and only admins a workspace macro. The scope cannot change. Audited as `automation.macro_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                actions: { type: array, items: { $ref: "#/components/schemas/RuleAction" } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [macro]
                properties:
                  macro: { $ref: "#/components/schemas/Macro" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Automation]
      summary: Delete a macro
      description: Audited as `automation.macro_deleted`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /macros/{id}/run:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Automation]
      summary: Run a macro on conversations
      description: |
        Runs the actions on up to 500 conversations, each independently: one failure does not
        undo the others. Conversations outside your mailboxes report `not_found`, read-only ones
        `forbidden`, and a conversation where an action failed `action_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_ids]
              properties:
                conversation_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: One result per conversation.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, ok, actions]
                      properties:
                        id: { type: string, format: uuid }
                        ok: { type: boolean }
                        code: { type: string }
                        actions:
                          type: array
                          items: { $ref: "#/components/schemas/RuleActionResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      description: |
        Only contacts the caller may see (see "Visibility of contacts" in SECURITY.md): a contact
        with at least one conversation in a mailbox the caller can read, or a contact without
        conversations that the caller created. Admins see every contact. Keyset pagination.
        `conversation_count` counts readable conversations only.
      parameters:
        - { name: q, in: query, description: "Matches name, any email address and organization name.", schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, last_activity, created], default: last_activity } }
        - { name: dir, in: query, description: "Defaults to `asc` for `name`, otherwise `desc`.", schema: { type: string, enum: [asc, desc] } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: segment_id, in: query, description: "Apply a saved segment. Not combinable with `filter`.", schema: { type: string, format: uuid } }
        - { name: filter, in: query, description: "A JSON-encoded ContactFilter (at most 8 KB).", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of contacts.
          content:
            application/json:
              schema:
                type: object
                required: [contacts, next_cursor]
                properties:
                  contacts:
                    type: array
                    items: { $ref: "#/components/schemas/CrmContactItem" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Contacts]
      summary: Create a contact
      description: |
        Needs at least one email address; the first is primary unless another is marked. Not for
        read-only users. Records `contact.created` in the audit log and for webhooks. 409
        `email_in_use` when an address already belongs to another contact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmContactInput" }
      responses:
        "201":
          description: The new contact.
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: "#/components/schemas/CrmContact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An email address already belongs to another contact (`email_in_use`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /contacts/export:
    get:
      tags: [Contacts]
      summary: Export contacts as CSV
      description: |
        Streams the contacts the caller may see, filtered like the list (same query parameters
        without paging), as UTF-8 CSV with a byte order mark and `;` as delimiter. Cells that a
        spreadsheet would run as a formula (starting with `=`, `+`, `-`, `@`, tab or carriage
        return) are prefixed with an apostrophe. Audited as `contact.exported` with the row count.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, last_activity, created] } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: segment_id, in: query, schema: { type: string, format: uuid } }
        - { name: filter, in: query, schema: { type: string } }
      responses:
        "200":
          description: The CSV file.
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /contacts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Get a contact
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: "#/components/schemas/CrmContact" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Contacts]
      summary: Edit a contact
      description: |
        Every field is optional. `emails` replaces the whole address list (add, remove, change the
        primary). `custom_attributes` is a patch: a value sets a key, `null` or an empty string
        removes it; values are validated against the attribute definitions. `organization_id: null`
        removes the organization. Not for read-only users.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmContactInput" }
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: "#/components/schemas/CrmContact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An email address already belongs to another contact (`email_in_use`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /contacts/{id}/resubscribe:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Contacts]
      summary: Lift a contact's unsubscription
      description: |
        Campaigns write to the contact again. Needs `campaigns.manage`; the contact must be visible
        to the caller. Does nothing, and is not audited, when the contact is not unsubscribed.
        Audited as `contact.resubscribed`.
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{id}/reactivate-address:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Contacts]
      summary: Use an address again after a bounce
      description: |
        Clears the bounce mark of one address so campaigns write to it again. Needs
        `campaigns.manage`; the contact must be visible to the caller. Does nothing, and is not
        audited, when the address has no bounce mark. Audited as `contact.address_reactivated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /contacts/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Contacts]
      summary: Merge another contact into this one
      description: |
        Irreversible. The contact in the path is the primary and wins where both have a value.
        The source's addresses, conversations, notes and attributes move to the primary and the
        source is deleted. Each moved conversation gets a `contact_merged` event. Both contacts
        must be visible to the caller. Audited as `contact.merged`. Not for read-only users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties:
                source_id: { type: string, format: uuid }
      responses:
        "200":
          description: The primary contact and what moved.
          content:
            application/json:
              schema:
                type: object
                required: [contact, merged]
                properties:
                  contact: { $ref: "#/components/schemas/CrmContact" }
                  merged:
                    type: object
                    required: [addresses, conversations, notes]
                    properties:
                      addresses: { type: integer }
                      conversations: { type: integer }
                      notes: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /contacts/{id}/conversations:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Conversations of a contact
      description: Readable conversations only, open and waiting first, then by recency.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of conversations.
          content:
            application/json:
              schema:
                type: object
                required: [conversations, next_cursor]
                properties:
                  conversations:
                    type: array
                    items: { $ref: "#/components/schemas/Conversation" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Activity of a contact
      description: Conversation events of readable conversations plus the contact's notes, newest first.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of timeline items.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TimelineItem" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Notes on a contact
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes:
                    type: array
                    items: { $ref: "#/components/schemas/CrmNote" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Contacts]
      summary: Add a note to a contact
      description: Plain text, at most 10000 characters. Not for read-only users.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmNoteInput" }
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: "#/components/schemas/CrmNote" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /contacts/{id}/notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Contacts]
      summary: Edit a contact note
      description: The author or an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmNoteInput" }
      responses:
        "200":
          description: The updated note.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: "#/components/schemas/CrmNote" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Contacts]
      summary: Delete a contact note
      description: The author or an admin.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{id}/data-export:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Contacts]
      summary: Request a GDPR export of a contact
      description: |
        Admin only. Queues a job that builds a ZIP with `contact.json` (profile, organization,
        notes, attributes, every conversation with its message text) and the attachment files.
        Poll `GET /data-exports/{id}`, then download once. Audited.
      responses:
        "202":
          description: The export was queued.
          content:
            application/json:
              schema:
                type: object
                required: [export]
                properties:
                  export: { $ref: "#/components/schemas/DataExport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{id}/erase:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Contacts]
      summary: Erase a contact (GDPR)
      description: |
        Admin only and irreversible. `confirmation` must equal the contact's primary email
        address. Replaces the contact's name and address on messages with a tombstone, deletes
        bodies, subjects, attachments and raw copies of conversations in which the contact is the
        only external party, drops the raw copies of other messages that name the contact, and
        removes the contact, its notes and earlier exports. Files that are still used elsewhere
        are kept. Backups are not reached. Audited with counts only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string }
      responses:
        "200":
          description: What was erased.
          content:
            application/json:
              schema:
                type: object
                required: [erased]
                properties:
                  erased:
                    type: object
                    required: [conversations_erased, conversations_kept, messages_blanked, messages_tombstoned, attachments_deleted, files_pending_deletion]
                    properties:
                      conversations_erased: { type: integer }
                      conversations_kept: { type: integer }
                      messages_blanked: { type: integer }
                      messages_tombstoned: { type: integer }
                      attachments_deleted: { type: integer }
                      files_pending_deletion: { type: integer, description: "Files that could not be deleted yet; a background job retries them." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /data-exports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Status of a GDPR export
      description: Admin only, and only the admin who requested it.
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                type: object
                required: [export]
                properties:
                  export: { $ref: "#/components/schemas/DataExport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /data-exports/{id}/download:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Download a GDPR export
      description: |
        The requesting admin can download the ZIP once; the file is deleted right after. 409
        `not_ready` while it is being built, 410 `gone` after the download or once it expired
        (24 hours). Audited.
      responses:
        "200":
          description: The ZIP file.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not ready (`not_ready`) or failed (`export_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Already downloaded or expired (`gone`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /organizations:
    get:
      tags: [Contacts]
      summary: List organizations
      description: |
        An organization is visible when one of its contacts is, or, without contacts, to the user
        who created it. Admins see all. Ordered by name.
      parameters:
        - { name: q, in: query, description: "Matches the name or a domain.", schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of organizations.
          content:
            application/json:
              schema:
                type: object
                required: [organizations, next_cursor]
                properties:
                  organizations:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationItem" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Contacts]
      summary: Create an organization
      description: |
        Domains are lower-cased, must be valid hostnames, may not be free-mail domains and belong
        to one organization at a time (409 `domain_in_use`). Incoming mail matches an organization
        by domain. Not for read-only users.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: The organization.
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A domain belongs to another organization (`domain_in_use`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Get an organization
      description: With up to 100 of its visible contacts.
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
