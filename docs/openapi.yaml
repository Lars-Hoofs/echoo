        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Contacts]
      summary: Save a contact segment
      description: A saved filter, personal or shared. Not for read-only users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, filter]
              properties:
                name: { type: string, maxLength: 80 }
                shared: { type: boolean, default: false }
                filter: { $ref: "#/components/schemas/ContactFilter" }
      responses:
        "201":
          description: The segment.
          content:
            application/json:
              schema:
                type: object
                required: [segment]
                properties:
                  segment: { $ref: "#/components/schemas/ContactSegment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /contact-segments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Contacts]
      summary: Edit a contact segment
      description: The owner or an admin (for shared segments). Someone else's personal segment is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                shared: { type: boolean }
                filter: { $ref: "#/components/schemas/ContactFilter" }
      responses:
        "200":
          description: The segment.
          content:
            application/json:
              schema:
                type: object
                required: [segment]
                properties:
                  segment: { $ref: "#/components/schemas/ContactSegment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Contacts]
      summary: Delete a contact segment
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contact-imports:
    post:
      tags: [Contacts]
      summary: Import contacts from a CSV file
      description: |
        Admin only. `multipart/form-data` with a `file` (UTF-8 CSV with a header row, `;` or `,`
        detected, at most 20 MB and 50000 rows) and `options` (JSON: `dedupe`, `columns`, optional
        `delimiter`). Exactly one column must map to `email`. Contacts are matched by email;
        `dedupe` decides whether an existing contact is `update`d (only the values in the file) or
        `skip`ped. The file is processed by a background job; poll `GET /contact-imports/{id}`.
        The uploaded file is deleted when the job ends. Audited.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, options]
              properties:
                file: { type: string, format: binary }
                options: { $ref: "#/components/schemas/ContactImportOptions" }
      responses:
        "202":
          description: The import was queued.
          content:
            application/json:
              schema:
                type: object
                required: [import]
                properties:
                  import: { $ref: "#/components/schemas/ContactImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: |
            Invalid upload. `fields.file`: `required`, `too_large`, `not_utf8`, `too_many_rows`,
            `empty`, `invalid_csv`. `fields.options`: `required` or `invalid`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /contact-imports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Progress of a contact import
      description: Admin only.
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                type: object
                required: [import]
                properties:
                  import: { $ref: "#/components/schemas/ContactImport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contact-imports/{id}/errors:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Contacts]
      summary: Error report of a contact import
      description: |
        Admin only. A CSV with the line number, the reason and the original cells of every row that
        was not imported. Kept for a week. 404 when the import had no errors.
      responses:
        "200":
          description: The CSV report.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/overview:
    get:
      tags: [Reports]
      summary: Headline numbers, comparison and series for a period
      description: |
        Definitions are in docs/reports.md. Days are bucketed in the workspace timezone
        (`GET /settings/reports`). `previous` covers the same number of days directly before the
        period. Durations are seconds; `time_basis` says whether they are wall-clock time or
        business time (SLA policies with business hours). Agents get only mailboxes they can
        read; only admins may filter on another agent.
      parameters:
        - { $ref: "#/components/parameters/ReportPeriod" }
        - { $ref: "#/components/parameters/ReportFrom" }
        - { $ref: "#/components/parameters/ReportTo" }
        - { $ref: "#/components/parameters/ReportGroup" }
        - { $ref: "#/components/parameters/ReportMailbox" }
        - { $ref: "#/components/parameters/ReportTeam" }
        - { $ref: "#/components/parameters/ReportAgent" }
        - { $ref: "#/components/parameters/ReportLabel" }
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /reports/agents:
    get:
      tags: [Reports]
      summary: Numbers per agent
      description: |
        Replies are attributed to their author, resolutions to the person who resolved, everything
        else to the conversation's current assignee. Admins see every agent and the unassigned
        row; other users see only their own row.
      parameters:
        - { $ref: "#/components/parameters/ReportPeriod" }
        - { $ref: "#/components/parameters/ReportFrom" }
        - { $ref: "#/components/parameters/ReportTo" }
        - { $ref: "#/components/parameters/ReportMailbox" }
        - { $ref: "#/components/parameters/ReportTeam" }
        - { $ref: "#/components/parameters/ReportAgent" }
        - { $ref: "#/components/parameters/ReportLabel" }
      responses:
        "200":
          description: One row per agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /reports/teams:
    get:
      tags: [Reports]
      summary: Numbers per team
      description: Grouped by the team the conversation is assigned to; `id` is null for conversations without a team.
      parameters:
        - { $ref: "#/components/parameters/ReportPeriod" }
        - { $ref: "#/components/parameters/ReportFrom" }
        - { $ref: "#/components/parameters/ReportTo" }
        - { $ref: "#/components/parameters/ReportMailbox" }
        - { $ref: "#/components/parameters/ReportTeam" }
        - { $ref: "#/components/parameters/ReportAgent" }
        - { $ref: "#/components/parameters/ReportLabel" }
      responses:
        "200":
          description: One row per team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /reports/mailboxes:
    get:
      tags: [Reports]
      summary: Numbers per mailbox
      description: Only mailboxes you can read appear.
      parameters:
        - { $ref: "#/components/parameters/ReportPeriod" }
        - { $ref: "#/components/parameters/ReportFrom" }
        - { $ref: "#/components/parameters/ReportTo" }
        - { $ref: "#/components/parameters/ReportMailbox" }
        - { $ref: "#/components/parameters/ReportTeam" }
        - { $ref: "#/components/parameters/ReportAgent" }
        - { $ref: "#/components/parameters/ReportLabel" }
      responses:
        "200":
          description: One row per mailbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /reports/labels:
    get:
      tags: [Reports]
      summary: Numbers per label
      description: A conversation with several labels counts under each; `id` is null for conversations without a label.
      parameters:
        - { $ref: "#/components/parameters/ReportPeriod" }
        - { $ref: "#/components/parameters/ReportFrom" }
        - { $ref: "#/components/parameters/ReportTo" }
        - { $ref: "#/components/parameters/ReportMailbox" }
        - { $ref: "#/components/parameters/ReportTeam" }
        - { $ref: "#/components/parameters/ReportAgent" }
        - { $ref: "#/components/parameters/ReportLabel" }
      responses:
        "200":
          description: One row per label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /reports/csat:
    get:
      tags: [Reports]
      summary: Customer satisfaction
      description: |
        Surveys are counted in the period they were sent, so the response rate cannot exceed 100
        percent. `by` picks the table's dimension (default `agent`; non-admins see only their own
        agent row). Comments are the latest 50 in the period.
      parameters:
        - { $ref: "#/components/parameters/ReportPeriod" }
        - { $ref: "#/components/parameters/ReportFrom" }
        - { $ref: "#/components/parameters/ReportTo" }
        - { $ref: "#/components/parameters/ReportGroup" }
        - { $ref: "#/components/parameters/ReportMailbox" }
        - { $ref: "#/components/parameters/ReportTeam" }
        - { $ref: "#/components/parameters/ReportAgent" }
        - { $ref: "#/components/parameters/ReportLabel" }
        - name: by
          in: query
          schema: { type: string, enum: [agent, team, mailbox, label] }
      responses:
        "200":
          description: The satisfaction report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCsat" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /reports/live:
    get:
      tags: [Reports]
      summary: The state right now
      description: |
        Open excludes snoozed conversations. `online` means the person has the app open (an event
        stream on this server); `availability` is what they set themselves. Non-admins see only
        their own row in `agents`.
      parameters:
        - { $ref: "#/components/parameters/ReportMailbox" }
        - { $ref: "#/components/parameters/ReportTeam" }
        - { $ref: "#/components/parameters/ReportAgent" }
        - { $ref: "#/components/parameters/ReportLabel" }
      responses:
        "200":
          description: Current counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportLive" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /reports/{kind}/export:
    get:
      tags: [Reports]
      summary: Download a report as CSV
      description: |
        Same filters as the report itself; `kind` is one of `overview`, `agents`, `teams`,
        `mailboxes`, `labels`, `csat` (also takes `by`) or `live`. Text cells that could be read as
        a spreadsheet formula are prefixed with an apostrophe. Durations are whole seconds, rates
        are percentages. Exports are audited.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [overview, agents, teams, mailboxes, labels, csat, live] }
        - { $ref: "#/components/parameters/ReportPeriod" }
        - { $ref: "#/components/parameters/ReportFrom" }
        - { $ref: "#/components/parameters/ReportTo" }
        - { $ref: "#/components/parameters/ReportGroup" }
        - { $ref: "#/components/parameters/ReportMailbox" }
        - { $ref: "#/components/parameters/ReportTeam" }
        - { $ref: "#/components/parameters/ReportAgent" }
        - { $ref: "#/components/parameters/ReportLabel" }
      responses:
        "200":
          description: The CSV file.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /settings/reports:
    get:
      tags: [Reports]
      summary: Read the reporting settings
      responses:
        "200":
          description: The workspace timezone that buckets days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Reports]
      summary: Change the reporting settings
      description: The timezone is an IANA name such as `Europe/Amsterdam`. The change is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /mailboxes/{id}/csat:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Mailboxes]
      summary: Read the satisfaction survey settings of a mailbox
      responses:
        "200":
          description: Survey settings; off by default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsatSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Mailboxes]
      summary: Change the satisfaction survey settings of a mailbox
      description: |
        When on, an email with five rating links is sent once per resolved conversation after
        `delay_hours` (0 to 24). Nothing is sent for spam, automatic mail or bounces, or when the
        customer's last message was an auto-reply. Only conversations resolved after switching the
        survey on are surveyed. The change is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CsatSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsatSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /kb/portal:
    get:
      tags: [Knowledge base]
      summary: The help center settings
      description: Texts and the optional custom domain of the public help center at `/hulp`. Every signed-in user can read them.
      responses:
        "200":
          description: The portal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbPortal" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [Knowledge base]
      summary: Change the help center settings (admin)
      description: |
        `custom_domain` is a host name (for example `hulp.example.nl`) of a reverse proxy that serves
        Echoo's `/hulp` paths on its own domain, with the same paths. It only changes the absolute
        URLs in canonical links, the sitemap, robots.txt and article links; leave it empty to use the
        base URL of Echoo. Audited as `kb.portal_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, title, intro, logo_text, custom_domain]
              properties:
                name: { type: string, maxLength: 100 }
                title: { type: string, maxLength: 150 }
                intro: { type: string, maxLength: 500 }
                logo_text: { type: string, maxLength: 40 }
                custom_domain: { type: string, maxLength: 253 }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbPortal" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /kb/categories:
    get:
      tags: [Knowledge base]
      summary: List categories
      responses:
        "200":
          description: All categories by position and name.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/KbCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Knowledge base]
      summary: Create a category (admin)
      description: An empty `slug` is derived from the name. Audited as `kb.category_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbCategoryInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /kb/categories/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Knowledge base]
      summary: Change a category (admin)
      description: Replaces all fields. Categories nest one level deep. Audited as `kb.category_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbCategoryInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Knowledge base]
      summary: Delete a category (admin)
      description: Only an empty category can be deleted; otherwise 409 `category_not_empty`. Audited as `kb.category_deleted`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The category still has articles or subcategories. }

  /kb/articles:
    get:
      tags: [Knowledge base]
      summary: List articles
      description: |
        Newest change first, at most 100. Owners, admins and agents see every status; readonly users
        only see published articles. `q` matches titles and, for whole words, the text.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published, archived] } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The articles, without their body.
          content:
            application/json:
              schema:
                type: object
                required: [articles]
                properties:
                  articles:
                    type: array
                    items: { $ref: "#/components/schemas/KbArticle" }
        "400": { description: A query parameter is invalid. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Knowledge base]
      summary: Create an article
      description: |
        Creates a draft. Not for readonly users. `body_html` is sanitized; images must have been
        uploaded with `POST /kb/images`. An empty `slug` is derived from the title, and made unique
        with a numeric suffix.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbArticleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbArticleDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /kb/articles/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Knowledge base]
      summary: Get an article
      description: Readonly users get 404 for drafts and archived articles.
      responses:
        "200":
          description: The article with its body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbArticleDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Knowledge base]
      summary: Change an article
      description: |
        Replaces title, slug, category, body and excerpt; send the `version` you loaded, or the
        answer is 409 `version_conflict` with `current_version`. The previous content is kept as a
        revision (the last 20). When the slug of a published article changes, the old address keeps
        redirecting (301) to the new one and cannot be given to another article.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/KbArticleInput" }
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, format: int32 }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbArticleDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`version_conflict`: someone else saved first." }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Knowledge base]
      summary: Delete an article
      description: Removes the article, its revisions and its redirects for good. Audited as `kb.article_deleted`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kb/articles/{id}/status:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Knowledge base]
      summary: Publish, unpublish or archive an article
      description: |
        `published` needs a category and a body (otherwise 422). Moving an article away from
        `published` takes it off the public site at once (within the one minute of cache). Audited
        as `kb.article_published`, `kb.article_unpublished` or `kb.article_archived`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, published, archived] }
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbArticleDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /kb/articles/{id}/revisions:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Knowledge base]
      summary: List the revisions of an article
      description: Newest first, at most 20. Not for readonly users.
      responses:
        "200":
          description: The revisions.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      required: [id, title, created_at, edited_by_name]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        created_at: { type: string, format: date-time }
                        edited_by_name: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kb/articles/{id}/revisions/{revisionId}/restore:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: revisionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Knowledge base]
      summary: Restore a revision
      description: Puts the title, excerpt and body of the revision back. The current content becomes a revision itself.
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbArticleDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /kb/images:
    post:
      tags: [Knowledge base]
      summary: Upload an article image
      description: |
        Multipart form with one `file` part, PNG, JPEG, GIF or WebP up to 5 MB, judged by content.
        Use the returned `url` as the `src` of an `img` in `body_html`. An image no article uses is
        removed after a day; once a published article uses it, it is public.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [id, url, filename, content_type, size]
                properties:
                  id: { type: string, format: uuid }
                  url: { type: string, example: /hulp/i/0199a000-0000-7000-8000-000000000000 }
                  filename: { type: string }
                  content_type: { type: string }
                  size: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: The image is larger than 5 MB. }
        "422": { $ref: "#/components/responses/Validation" }

  /settings/retention:
    get:
      tags: [Operations]
      summary: Read the data retention settings
      description: |
        Requires the `settings.manage` permission. Periods left `null` keep that kind of data
        forever. `mailboxes` lists mailboxes that override the workspace periods as a whole;
        a mailbox that is not listed follows `global`. `audit_months` applies to the whole audit
        log and defaults to 12. Webhook delivery logs (14 days) and automation rule runs
        (30 days) have fixed periods and are not configurable.
      responses:
        "200":
          description: The settings and the outcome of the last daily purge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Operations]
      summary: Change the data retention settings
      description: |
        Replaces all settings. The purge runs once a day and deletes in batches of 1000; use
        `POST /settings/retention/preview` first to see what would go. The change is audited
        (`settings.retention_changed`), and so is every purge batch, with counts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /settings/retention/preview:
    post:
      tags: [Operations]
      summary: Preview what a purge would delete
      description: |
        Dry run: counts what the given settings would delete right now, without saving or
        deleting anything. Takes the same body as `PUT /settings/retention`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionInput" }
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/keys:
    get:
      tags: [Operations]
      summary: Encryption key status
      description: |
        Owner only. Lists the configured encryption keys and how many stored secrets each one
        protects, so the owner can see when an old key is no longer used and can be removed from
        `ECHOO_ENCRYPTION_KEYS` (see docs/operations.md, key rotation).
      responses:
        "200":
          description: Usage per key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: No encryption keys are configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns (campaigns.manage)
      description: |
        The newest 200 campaigns on mailboxes you can read, with their recipient counts, and the
        rate limits: `default_rate` for a new campaign and `max_rate`, the operator's cap per mailbox
        (`ECHOO_CAMPAIGN_MAX_RATE`).
      responses:
        "200":
          description: The campaigns.
          content:
            application/json:
              schema:
                type: object
                required: [campaigns, limits]
                properties:
                  campaigns:
                    type: array
                    items: { $ref: "#/components/schemas/Campaign" }
                  limits:
                    type: object
                    required: [default_rate, max_rate]
                    properties:
                      default_rate: { type: integer }
                      max_rate: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Campaigns]
      summary: Create a draft campaign (campaigns.manage)
      description: |
        A draft may be incomplete; only `name` and `mailbox_id` are required. The mailbox must be one
        you can write to, the segment one you own or that is shared. `body_html` is sanitized like a
        reply. Placeholders in subject and body are limited to `contact.name`, `contact.first_name`,
        `contact.email`, `agent.name`, `agent.first_name` and `mailbox.name`; another one is refused
        (`unknown_variable`). A placeholder the recipient has no value for is removed when sending.
        Audited as `campaign.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /campaigns/preview:
    post:
      tags: [Campaigns]
      summary: Count the recipients of a segment (campaigns.manage)
      description: |
        What a campaign to the segment would do, as you would send it: only contacts you can see. The
        counts of contacts that are skipped add up with `sendable` to `total`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segment_id]
              properties:
                segment_id: { type: string, format: uuid }
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /campaigns/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Campaigns]
      summary: Get a campaign (campaigns.manage)
      responses:
        "200":
          description: The campaign with its counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Campaigns]
      summary: Change a draft (campaigns.manage)
      description: Only a draft can be changed; otherwise 409 `campaign_state`. Audited as `campaign.updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CampaignState" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Campaigns]
      summary: Delete a campaign (campaigns.manage)
      description: |
        A draft, a finished or a cancelled campaign; another state answers 409 `campaign_state`. Its
        report goes with it. The conversations it created stay. Audited as `campaign.deleted`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CampaignState" }

  /campaigns/{id}/test:
    post:
      tags: [Campaigns]
      summary: Send a test mail to yourself (campaigns.manage)
      description: |
        Delivers the campaign, with placeholders filled in as for you, to your own address over the
        mailbox's SMTP server, and waits for the result. No conversation is created and the
        unsubscribe link in it is a placeholder. Limited to 10 per minute per user. When the server
        refuses it: 502 `test_send_failed` with the reason in `fields.reason`. Audited as
        `campaign.test_sent`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [sent_to]
                properties:
                  sent_to: { type: string, format: email }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { description: "Too many test mails; see `Retry-After`." }
        "502":
          description: The mail server did not accept the test mail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /campaigns/{id}/start:
    post:
      tags: [Campaigns]
      summary: Start or schedule a draft (campaigns.manage)
      description: |
        Without `scheduled_at` the campaign starts now, otherwise it waits until that moment (in the
        future, at most a year ahead). The recipients are resolved when it starts, with the visibility
        of the user who starts it (not the author of the draft), so a scheduled campaign uses the
        contacts and unsubscribes of that moment. The segment must be one the starting user may use
        (a personal segment of someone else gives 422 on `segment_id`). Subject, body, segment and an enabled mailbox are required (422 lists what is
        missing). Audited as `campaign.started` or `campaign.scheduled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_at: { type: string, format: date-time }
      responses:
        "200":
          description: Started or scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CampaignState" }
        "422": { $ref: "#/components/responses/Validation" }

  /campaigns/{id}/pause:
    post:
      tags: [Campaigns]
      summary: Pause a running campaign (campaigns.manage)
      description: Stops handing out new messages; messages already queued still go. Audited as `campaign.paused`.
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CampaignState" }

  /campaigns/{id}/resume:
    post:
      tags: [Campaigns]
      summary: Resume a paused campaign (campaigns.manage)
      description: Audited as `campaign.resumed`.
      responses:
        "200":
          description: Running again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CampaignState" }

  /campaigns/{id}/cancel:
    post:
      tags: [Campaigns]
      summary: Cancel a scheduled, running or paused campaign (campaigns.manage)
      description: |
        Recipients that were not reached and messages still waiting in the send queue are skipped with
        reason `cancelled`. A message that is being delivered at that moment still goes out and is
        recorded as sent. Audited as `campaign.cancelled`.
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CampaignState" }

  /campaigns/{id}/recipients:
    get:
      tags: [Campaigns]
      summary: The recipients of a campaign (campaigns.manage)
      description: |
        Keyset pagination: pass `next` of the previous page as `after`. Only recipients whose contact
        the caller may see are listed (owners and admins see all; a recipient whose contact was erased
        or merged away is for them only), so the rows can be fewer than `counts` says.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [pending, queued, sent, failed, skipped] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: after
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [recipients, next]
                properties:
                  recipients:
                    type: array
                    items: { $ref: "#/components/schemas/CampaignRecipient" }
                  next: { type: string, format: uuid, nullable: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /campaigns/{id}/report:
    get:
      tags: [Campaigns]
      summary: Per-recipient report as CSV (campaigns.manage)
      description: |
        One row per recipient the caller may see (the same rule as the recipient list): address, name, state, skip reason, error and times. Semicolon separated,
        UTF-8 with a byte order mark, and cells that a spreadsheet would run as a formula are prefixed
        with an apostrophe. Audited as `campaign.report_exported`.
      responses:
        "200":
          description: The report.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal API token (`ech_...`).
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-echoo_session
      description: Browser session (`echoo_session` without the prefix on plain-http localhost).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the session cookie on every non-GET request.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportPeriod:
      name: period
      in: query
      description: A preset ending today, or `custom` with `from` and `to`. Default `7d`.
      schema: { type: string, enum: [today, 7d, 30d, 90d, custom] }
    ReportFrom:
      name: from
      in: query
      description: First day of a custom period (workspace timezone, inclusive).
      schema: { type: string, format: date }
    ReportTo:
      name: to
      in: query
      description: Last day of a custom period (inclusive). At most 366 days in total.
      schema: { type: string, format: date }
    ReportGroup:
      name: group
      in: query
      description: Bucket width of a series. Default `day`, or `week` for periods longer than 92 days.
      schema: { type: string, enum: [day, week] }
    ReportMailbox:
      name: mailbox
      in: query
      description: Limit to one mailbox you can read; another id answers 404.
      schema: { type: string, format: uuid }
    ReportTeam:
      name: team
      in: query
      schema: { type: string, format: uuid }
    ReportAgent:
      name: agent
      in: query
      description: Limit to the conversations assigned to one agent. Only admins may name someone else (403 otherwise).
      schema: { type: string, format: uuid }
    ReportLabel:
      name: label
      in: query
      schema: { type: string, format: uuid }
    AuditAction:
      name: action
      in: query
      description: Action name or prefix, for example `user.` or `auth.login`.
      schema: { type: string, pattern: "^[a-z0-9_.]{1,64}$" }
    AuditActor:
      name: actor
      in: query
      schema: { type: string, format: uuid }
    AuditFrom:
      name: from
      in: query
      description: First day to include (UTC).
      schema: { type: string, format: date }
    AuditTo:
      name: to
      in: query
      description: Last day to include (UTC).
      schema: { type: string, format: date }
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: No valid session or token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Not allowed. Codes: `forbidden`, `csrf_failed`, `token_read_only`, `session_required`,
        `password_change_required`, `mfa_enrollment_required`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Does not exist, or you may not see it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: One or more fields are invalid; `error.fields` maps field names to codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CampaignState:
      description: The campaign is in a state that does not allow this (`campaign_state`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BulkResults:
      description: One result per conversation, unparsable ids first.
      content:
        application/json:
          schema:
            type: object
            required: [results]
            properties:
              results:
                type: array
                items:
                  type: object
                  required: [id, ok]
                  properties:
                    id: { type: string }
                    ok: { type: boolean }
                    code: { type: string }
                    version: { type: integer }
  requestBodies:
    TrashIDs:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                type: array
                minItems: 1
                maxItems: 500
                items: { type: string, format: uuid }
  schemas:
    LabelRef:
      type: object
      required: [id, name, color_token]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color_token: { type: string, enum: [slate, blue, teal, green, amber, orange, red, violet] }
    Label:
      allOf:
        - { $ref: "#/components/schemas/LabelRef" }
        - type: object
          required: [description, created_at]
          properties:
            description: { type: string }
            created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    ApiToken:
      type: object
      required: [id, name, prefix, scope, expires_at, last_used_at, created_at, user_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "The first characters of the token, to recognize it." }
        scope: { type: string, enum: [read, write] }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        user_name: { type: string, description: "Only in the admin list." }
        user_email: { type: string, description: "Only in the admin list." }
    WebhookEvent:
      type: string
      enum:
        - conversation.created
        - conversation.updated
        - conversation.status_changed
        - conversation.assigned
        - conversation.automation
        - message.created
        - message.sent
        - message.failed
        - contact.created
    Webhook:
      type: object
      required: [id, url, events, include_content, allow_http, enabled, disabled_reason, consecutive_failures, created_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEvent" }
        include_content: { type: boolean }
        allow_http: { type: boolean }
        enabled: { type: boolean }
        disabled_reason:
          type: string
          description: "`too_many_failures` after 50 consecutive failed attempts, otherwise empty."
        consecutive_failures: { type: integer }
        created_at: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      required: [id, event, status, status_code, error, duration_ms, attempt, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event: { type: string }
        status: { type: string, enum: [pending, retrying, succeeded, failed] }
        status_code: { type: integer, nullable: true }
        error:
          type: string
          description: A code, not a message. `http_status`, `blocked_destination`, `timeout`, `tls_error`, `dns_error`, `connection_failed` or `webhook_disabled`.
        duration_ms: { type: integer, nullable: true }
        attempt: { type: integer, description: "The attempt that produced the latest result, at most 6." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Job:
      type: object
      required: [id, kind, state, attempt, max_attempts, last_error, scheduled_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        state: { type: string, enum: [retryable, discarded] }
        attempt: { type: integer }
        max_attempts: { type: integer }
        last_error: { type: string }
        scheduled_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, at, actor_id, actor_name, actor_email, ip, action, target_type, target_id, metadata]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor_id: { type: string }
        actor_name: { type: string }
        actor_email: { type: string }
        ip: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        metadata: { type: object, additionalProperties: true }
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Address:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        address: { type: string, description: "Lower-cased email address." }
    Role:
      type: string
      enum: [owner, admin, agent, readonly]
    User:
      type: object
      required: [id, email, name, role, custom_role_id, theme, availability, mfa_enabled, deactivated, can_write_conversations, last_login_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, agent, readonly, custom] }
        can_write_conversations: { type: boolean, description: "Whether the user's role allows changing conversations, which custom roles decide themselves." }
        custom_role_id: { type: string, format: uuid, nullable: true, description: Set when `role` is `custom`. }
        theme: { type: string, enum: [system, light, dark] }
        availability: { type: string, enum: [online, busy, offline], description: "Only online agents receive automatically assigned conversations." }
        mfa_enabled: { type: boolean }
        deactivated: { type: boolean }
        invited_at: { type: string, format: date-time, nullable: true, description: Set while the user has not accepted the invitation. }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    LinkInfo:
      type: object
      required: [email, name]
      properties:
        email: { type: string }
        name: { type: string }
    EmailNotificationSettings:
      type: object
      required: [mentions, assignments]
      properties:
        mentions: { type: boolean }
        assignments: { type: boolean }
        replies: { type: boolean, description: "Customer replies in conversations assigned to you. Optional on PUT; omitting it keeps the stored choice." }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Shown once.
          items: { type: string }
    Session:
      type: object
      required: [id, current, created_at, last_seen_at, ip, user_agent]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        ip: { type: string }
        user_agent: { type: string }
    Signature:
      type: object
      required: [body_html]
      properties:
        mailbox_id: { type: string, format: uuid, nullable: true, description: "Null for the default signature." }
        body_html: { type: string }
    Notification:
      type: object
      required: [id, kind, conversation_id, conversation_number, conversation_subject, message_id, actor, created_at, read_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [mention, assigned, reply, sla, csat] }
        conversation_id: { type: string, format: uuid }
        conversation_number: { type: integer, format: int64 }
        conversation_subject: { type: string }
        message_id: { type: string, format: uuid, nullable: true }
        actor:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/Ref" }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
    LabelColor:
      type: string
      enum: [slate, blue, teal, green, amber, orange, red, violet]
    ContactRef:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
    ContactDetail:
      allOf:
        - { $ref: "#/components/schemas/ContactRef" }
        - type: object
          required: [organization, conversation_count]
          properties:
            organization:
              nullable: true
              allOf:
                - { $ref: "#/components/schemas/Ref" }
            conversation_count: { type: integer }
    SavedViewFilters:
      type: object
      additionalProperties: false
      description: The same filters as the conversation list. Omitted fields do not filter; an omitted status means open.
      properties:
        status: { type: string, enum: [open, waiting, closed, spam, snoozed] }
        mailbox_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        label_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        team_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        assignee: { type: string, description: "`me`, `none` or a user id." }
        priorities: { type: array, items: { type: string, enum: [none, low, normal, high, urgent] } }
        has_attachment: { type: boolean }
        after: { type: string, format: date }
        before: { type: string, format: date }
        contact_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
    SavedView:
      type: object
      required: [id, name, scope, team, filters, sort, position, editable, open_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [personal, everyone, team] }
        team:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/Ref" }
        filters: { $ref: "#/components/schemas/SavedViewFilters" }
        sort: { type: string, enum: [last_message_desc] }
        position: { type: integer }
        editable: { type: boolean, description: "Whether you may change or delete this view." }
        open_count: { type: integer, nullable: true, description: "Capped at 1000." }
    Conversation:
      type: object
      required: [id, number, subject, status, priority, version, snoozed_until, labels, preview, last_message_at, message_count, has_attachments, last_direction, mailbox, contact, assignee, team, sla, unread]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        subject: { type: string }
        status: { type: string, enum: [open, waiting, closed, spam] }
        priority: { type: string, enum: [none, low, normal, high, urgent] }
        version: { type: integer, format: int32, description: "Changes on every update; use it as `expected_version`." }
        snoozed_until: { type: string, format: date-time, nullable: true }
        labels:
          type: array
          items: { $ref: "#/components/schemas/LabelRef" }
        preview: { type: string }
        last_message_at: { type: string, format: date-time }
        message_count: { type: integer }
        has_attachments: { type: boolean }
        last_direction: { type: string, nullable: true, description: "Direction of the last message, `in` or `out`." }
        unread: { type: boolean, description: "Personal to you: you marked it unread, or a customer message or a note by someone else arrived after you last opened or answered it." }
        sla:
          type: object
          nullable: true
          description: Null when no SLA policy applies. Clients count down to the due times; the resolution deadline is paused while the status is waiting.
          required: [state, first_response_due_at, first_response_met_at, resolution_due_at]
          properties:
            state: { type: string, enum: [none, ok, at_risk, breached] }
            first_response_due_at: { type: string, format: date-time, nullable: true }
            first_response_met_at: { type: string, format: date-time, nullable: true }
            resolution_due_at: { type: string, format: date-time, nullable: true }
        mailbox: { $ref: "#/components/schemas/Ref" }
        contact:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/ContactRef" }
        assignee:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/Ref" }
        team:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/Ref" }
    ConversationDetail:
      allOf:
        - { $ref: "#/components/schemas/Conversation" }
        - type: object
          required: [created_at, first_responded_at, resolved_at, can_write]
          properties:
            created_at: { type: string, format: date-time }
            first_responded_at: { type: string, format: date-time, nullable: true }
            resolved_at: { type: string, format: date-time, nullable: true }
            can_write: { type: boolean, description: "False when the caller may read the mailbox but not change conversations in it." }
    ConversationVersion:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int32 }
    Attachment:
      type: object
      required: [id, filename, size, sniffed_type, inline]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        size: { type: integer, format: int64 }
        sniffed_type: { type: string, description: "Content type detected from the bytes." }
        inline: { type: boolean }
        download_url: { type: string, description: "Not set on a message returned right after sending." }
        dangerous: { type: boolean, description: "Not set on a message returned right after sending." }
        scan_status:
          type: string
          enum: [not_scanned, clean, infected, error]
          description: "Result of the ClamAV scan. `infected` files cannot be downloaded; `error` files could not be scanned. Not set on a message returned right after sending."
    PhishingWarning:
      type: object
      required: [kind, detail]
      properties:
        kind: { type: string }
        detail: { type: string }
    Message:
      type: object
      required: [id, kind, direction, from, to, cc, subject, body_text, sent_at, received_at, author, attachments, outbound_status, outbound_error]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "For example an email or an internal note." }
        direction: { type: string, nullable: true, description: "`in` or `out`; null for notes." }
        from: { $ref: "#/components/schemas/Address" }
        to:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        cc:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        subject: { type: string }
        body_text: { type: string }
        sent_at: { type: string, format: date-time, nullable: true }
        received_at: { type: string, format: date-time }
        author:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/Ref" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        outbound_status: { type: string, nullable: true, description: "Delivery state of an outgoing message." }
        outbound_error: { type: string, nullable: true }
        has_html: { type: boolean, description: "Only on the conversation detail." }
        render_url: { type: string, description: "Only on the conversation detail. Sanitized HTML for a sandboxed iframe." }
        blocked_images: { type: integer, description: "Only on the conversation detail." }
        phishing_warnings:
          type: array
          description: Only on the conversation detail.
          items: { $ref: "#/components/schemas/PhishingWarning" }
    ConversationEvent:
      type: object
      required: [id, type, created_at, actor, user, data]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: "For example `created` or `status_changed`." }
        created_at: { type: string, format: date-time }
        actor:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/Ref" }
        user:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/Ref" }
        data: { type: object, additionalProperties: true }
    SendMessageRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, format: uuid, description: "Generate one per send attempt; a retry with the same key never sends twice." }
        to:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        cc:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        bcc:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        subject: { type: string, maxLength: 300, description: "Defaults to the conversation subject with a reply or forward prefix." }
        html: { type: string, description: "Sanitized. At most 500 KiB." }
        text: { type: string, description: "Optional plain text part. At most 500 KiB." }
        attachment_ids:
          type: array
          maxItems: 20
          description: Ids from `POST /uploads`. Total size is limited to 50 MiB.
          items: { type: string, format: uuid }
        status_after:
          type: string
          enum: [waiting, closed]
          description: Set the conversation status after queuing.
        message_id: { type: string, format: uuid, description: "Only for forwarding. The message to forward." }
        mailbox_id: { type: string, format: uuid, description: "Only for starting a conversation. The sending mailbox." }
    SentMessage:
      type: object
      required: [message, undo_until]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        undo_until: { type: string, format: date-time, nullable: true, description: "Until then the message can be cancelled." }
    Upload:
      type: object
      required: [id, filename, size, content_type, content_id, expires_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        size: { type: integer, format: int64 }
        content_type: { type: string }
        content_id: { type: string, description: "Use as `cid:` in the HTML to embed an image." }
        expires_at: { type: string, format: date-time }
    Draft:
      type: object
      required: [to, cc, bcc, subject, html, attachments, updated_at]
      properties:
        to:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        cc:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        bcc:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        subject: { type: string }
        html: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Upload" }
        updated_at: { type: string, format: date-time }
    RealtimeEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [message.created, message.updated, conversation.updated, notification, presence, scope.changed, resync] }
        conversation_id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        state: { type: string, enum: [viewing, typing, left], description: "Only on presence events." }
        name: { type: string, description: "Only on presence events." }
        version: { type: integer, format: int64 }
    TemplateInput:
      type: object
      required: [name, body_html]
      description: |
        Required on create: `scope`, plus `team_id` for `team` and `mailbox_id` for `mailbox`. A
        personal template needs `conversations.write`; the other scopes also need
        `templates.manage_shared`. On update the scope fields are ignored.
      properties:
        scope: { type: string, enum: [personal, team, mailbox, global] }
        team_id: { type: string, format: uuid, description: "For scope `team`." }
        mailbox_id: { type: string, format: uuid, description: "For scope `mailbox`." }
        name: { type: string, maxLength: 100 }
        shortcode: { type: string, pattern: "^[a-z0-9_-]{0,32}$" }
        subject: { type: string, maxLength: 300 }
        body_html: { type: string, description: "Sanitized. Must not be empty. At most 500 KiB." }
    Template:
      type: object
      required: [id, name, shortcode, scope, team_id, mailbox_id, subject, body_html, editable, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shortcode: { type: string }
        scope: { type: string, enum: [personal, team, mailbox, global] }
        team_id: { type: string, format: uuid, nullable: true }
        mailbox_id: { type: string, format: uuid, nullable: true }
        subject: { type: string }
        body_html: { type: string }
        editable: { type: boolean, description: "Whether you may change or delete it." }
        updated_at: { type: string, format: date-time }
    MailboxInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        email_address: { type: string }
        display_name: { type: string, maxLength: 200 }
        imap_host: { type: string }
        imap_port: { type: integer, minimum: 1, maximum: 65535, default: 993 }
        imap_tls: { type: string, enum: [implicit, starttls], default: implicit }
        imap_username: { type: string, maxLength: 254 }
        imap_password: { type: string, maxLength: 1024, description: "Stored encrypted; never returned." }
        smtp_host: { type: string }
        smtp_port: { type: integer, minimum: 1, maximum: 65535, default: 465 }
        smtp_tls: { type: string, enum: [implicit, starttls], default: implicit }
        smtp_username: { type: string, maxLength: 254 }
        smtp_password: { type: string, maxLength: 1024, description: "Stored encrypted; never returned." }
        sent_folder: { type: string, maxLength: 200 }
        send_delay_seconds: { type: integer, minimum: 0, maximum: 30, default: 5 }
        allow_internal_host: { type: boolean, description: "Only the owner may change it." }
    Mailbox:
      type: object
      required: [id, name, email_address, display_name, imap_host, imap_port, imap_tls, imap_username, imap_password_set, smtp_host, smtp_port, smtp_tls, smtp_username, smtp_password_set, sent_folder, send_delay_seconds, allow_internal_host, auth_type, oauth_connected_at, needs_reconnect, sync_state, sync_reason, sync_state_changed_at, last_synced_at, disabled_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email_address: { type: string }
        display_name: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_tls: { type: string, enum: [implicit, starttls] }
        imap_username: { type: string }
        imap_password_set: { type: boolean }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_tls: { type: string, enum: [implicit, starttls] }
        smtp_username: { type: string }
        smtp_password_set: { type: boolean }
        sent_folder: { type: string }
        send_delay_seconds: { type: integer }
        allow_internal_host: { type: boolean }
        auth_type: { type: string, enum: [password, oauth_google, oauth_microsoft] }
        oauth_connected_at: { type: string, format: date-time, nullable: true }
        needs_reconnect: { type: boolean, description: "The provider rejected the stored token; connect the account again." }
        sync_state: { type: string, enum: [connected, polling, backoff, auth_failed, disabled] }
        sync_reason:
          type: string
          nullable: true
          enum: [connect_failed, tls_failed, auth_failed, oauth_reauth_required, internal_destination, no_inbox, unknown]
          description: Why the last sync failed, null when it did not. The server's own error text is never returned.
        sync_state_changed_at: { type: string, format: date-time }
        last_synced_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProbeResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        code: { type: string, description: "Present when `ok` is false." }
    MailboxAccessEntry:
      type: object
      required: [team_id, level]
      properties:
        team_id: { type: string, format: uuid }
        level: { type: string, enum: [read, write] }
    Team:
      type: object
      required: [id, name, member_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        member_count: { type: integer }
        created_at: { type: string, format: date-time }
    CustomRole:
      type: object
      required: [id, name, description, permissions, member_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
        member_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SSOSettings:
      type: object
      required: [enabled, issuer_url, client_id, client_secret_set, allowed_domains, button_label, required, auto_provision, default_role, default_custom_role_id, trust_idp_mfa, trust_missing_email_verified, allow_internal_issuer, redirect_uri]
      properties:
        enabled: { type: boolean }
        issuer_url: { type: string }
        client_id: { type: string }
        client_secret_set: { type: boolean }
        allowed_domains:
          type: array
          items: { type: string }
        button_label: { type: string }
        required: { type: boolean }
        auto_provision: { type: boolean }
        default_role: { type: string, enum: [agent, readonly, custom] }
        default_custom_role_id: { type: string, format: uuid, nullable: true }
        trust_idp_mfa: { type: boolean, description: "Skip Echoo's two-factor step when the provider reports `mfa`, `otp` or `hwk` in `amr`." }
        trust_missing_email_verified: { type: boolean, description: "Accept identities without an `email_verified` claim (Microsoft Entra ID). A claim that is false is always refused." }
        allow_internal_issuer: { type: boolean }
        redirect_uri: { type: string, description: "The callback URL to register at the provider." }
    SSOSettingsInput:
      type: object
      required: [enabled, issuer_url, client_id, allowed_domains, button_label, required, auto_provision, trust_idp_mfa, trust_missing_email_verified, allow_internal_issuer]
      properties:
        enabled: { type: boolean }
        issuer_url: { type: string, maxLength: 500 }
        client_id: { type: string, maxLength: 500 }
        client_secret: { type: string, maxLength: 2000, description: Write-only; omit or leave empty to keep the stored secret. }
        allowed_domains:
          type: array
          maxItems: 50
          items: { type: string }
        button_label: { type: string, maxLength: 40 }
        required: { type: boolean }
        auto_provision: { type: boolean }
        default_role: { type: string, enum: [agent, readonly] }
        default_custom_role_id: { type: string, format: uuid }
        trust_idp_mfa: { type: boolean }
        trust_missing_email_verified: { type: boolean }
        allow_internal_issuer: { type: boolean }
    SecuritySettings:
      type: object
      required: [require_mfa]
      properties:
        require_mfa: { type: boolean }
    EmailSettings:
      type: object
      required: [footer_text]
      properties:
        footer_text: { type: string, maxLength: 300, description: "Single line added to the footer of outgoing mail." }
    RuleCondition:
      type: object
      description: |
        A condition (`field`, `op`, `value`, optional `negate`) or a nested group (`match`, `items`).
        Fields and ops: `mailbox`, `status`, `priority` (op `is`, value a list of ids or values);
        `label` (op `has_any`, list of label ids); `from_address`, `from_domain`, `subject`, `body`,
        `organization` (ops `equals`, `contains`, `starts_with`, `ends_with`, value text, compared
        case-insensitively; `body` is the plain text part); `has_attachment`, `has_assignee`,
        `has_team`, `auto_submitted`, `within_business_hours` (op `is`, value a boolean).
      properties:
        match: { type: string, enum: [all, any] }
        items: { type: array, items: { $ref: "#/components/schemas/RuleCondition" } }
        field: { type: string }
        op: { type: string }
        value: {}
        negate: { type: boolean }
    RuleConditions:
      type: object
      required: [match, items]
      properties:
        match: { type: string, enum: [all, any] }
        items: { type: array, items: { $ref: "#/components/schemas/RuleCondition" } }
    RuleAction:
      type: object
      required: [type]
      description: |
        Each type accepts only its own fields. `assign_agent` (user_id), `assign_team` (team_id),
        `assign_round_robin` (optional team_id), `set_priority` (priority), `add_label` and
        `remove_label` (label_id), `set_status` (status open, waiting or closed), `mark_spam`,
        `snooze` (hours, 1 to 8760), `apply_sla` (policy_id), `add_note` (text), `send_webhook`
        (fires the `conversation.automation` webhook event), and `auto_reply` (template_id, or
        text with optional subject; rules only).
      properties:
        type: { type: string, enum: [assign_agent, assign_team, assign_round_robin, set_priority, add_label, remove_label, set_status, mark_spam, snooze, apply_sla, add_note, send_webhook, auto_reply] }
        user_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        priority: { type: string, enum: [none, low, normal, high, urgent] }
        label_id: { type: string, format: uuid }
        status: { type: string, enum: [open, waiting, closed] }
        hours: { type: integer, minimum: 1, maximum: 8760 }
        policy_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        subject: { type: string, maxLength: 200 }
        text: { type: string, maxLength: 5000 }
    RuleActionResult:
      type: object
      required: [type, result]
      properties:
        type: { type: string }
        result: { type: string, enum: [applied, skipped, failed] }
        detail: { type: string }
    Rule:
      type: object
      required: [id, name, mailbox_id, trigger, idle_hours, conditions, actions, stop_processing, position, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mailbox_id: { type: string, format: uuid, nullable: true, description: "Null applies to every mailbox." }
        trigger: { type: string, enum: [conversation_created, message_received, conversation_updated, sla_at_risk, sla_breached, customer_idle] }
        idle_hours: { type: integer, nullable: true, description: "Only for `customer_idle`: hours in status waiting without a customer reply." }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { type: array, items: { $ref: "#/components/schemas/RuleAction" } }
        stop_processing: { type: boolean, description: "When the rule matched, later rules are skipped." }
        position: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RuleInput:
      type: object
      description: Required on create - name, trigger and actions.
      properties:
        name: { type: string, maxLength: 100 }
        mailbox_id: { type: string, format: uuid, nullable: true }
        trigger: { type: string, enum: [conversation_created, message_received, conversation_updated, sla_at_risk, sla_breached, customer_idle] }
        idle_hours: { type: integer, minimum: 1, maximum: 720, nullable: true }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/RuleAction" } }
        stop_processing: { type: boolean }
        enabled: { type: boolean }
    RuleRun:
      type: object
      required: [id, conversation_id, conversation_number, trigger, matched, actions, error, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        conversation_number: { type: integer }
        trigger: { type: string }
        matched: { type: boolean }
        actions: { type: array, items: { $ref: "#/components/schemas/RuleActionResult" } }
        error: { type: string }
        created_at: { type: string, format: date-time }
    BusinessHoursRange:
      type: object
      required: [start, end]
      properties:
        start: { type: string, example: "09:00" }
        end: { type: string, example: "17:00", description: "`24:00` is allowed; an end before the start continues into the next morning." }
    BusinessHours:
      type: object
      required: [id, name, timezone, weekly, holidays, is_default, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string, example: Europe/Amsterdam }
        weekly:
          type: object
          description: Keys `mon` to `sun`; a missing day is closed.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/BusinessHoursRange" }
        holidays: { type: array, items: { type: string, format: date } }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BusinessHoursInput:
      type: object
      description: Required on create - name, timezone and weekly.
      properties:
        name: { type: string, maxLength: 100 }
        timezone: { type: string, description: "IANA name." }
        weekly:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/BusinessHoursRange" }
        holidays: { type: array, maxItems: 200, items: { type: string, format: date } }
        is_default: { type: boolean }
    SlaPolicy:
      type: object
      required: [id, name, first_response_minutes, resolution_minutes, at_risk_percent, business_hours_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        first_response_minutes: { type: integer, nullable: true }
        resolution_minutes: { type: integer, nullable: true }
        at_risk_percent: { type: integer, description: "A deadline is at risk once this percentage of its time has passed." }
        business_hours_id: { type: string, format: uuid, nullable: true, description: "Null counts calendar time." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SlaPolicyInput:
      type: object
      description: Required on create - name and at least one target.
      properties:
        name: { type: string, maxLength: 100 }
        first_response_minutes: { type: integer, minimum: 1, maximum: 525600, nullable: true }
        resolution_minutes: { type: integer, minimum: 1, maximum: 525600, nullable: true }
        at_risk_percent: { type: integer, minimum: 1, maximum: 99, default: 80 }
        business_hours_id: { type: string, format: uuid, nullable: true }
    MailboxAutomation:
      type: object
      required: [id, name, email_address, auto_assign_mode, default_sla_policy_id, business_hours_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email_address: { type: string }
        auto_assign_mode: { type: string, enum: [off, round_robin, balanced] }
        default_sla_policy_id: { type: string, format: uuid, nullable: true }
        business_hours_id: { type: string, format: uuid, nullable: true, description: "Null uses the workspace default." }
    Agent:
      type: object
      required: [id, name, email, role, max_open, availability, open_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        max_open: { type: integer, nullable: true }
        availability: { type: string, enum: [online, busy, offline] }
        open_count: { type: integer }
    AutomationSettings:
      type: object
      required: [auto_resolve_days]
      properties:
        auto_resolve_days: { type: integer, minimum: 0, maximum: 365, description: "Close conversations in status waiting after this many days without a customer reply; 0 is off." }
    Macro:
      type: object
      required: [id, name, scope, owner, actions, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [personal, global] }
        owner: { type: boolean, description: "Whether the caller owns this personal macro." }
        actions: { type: array, items: { $ref: "#/components/schemas/RuleAction" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomAttributeValues:
      type: object
      description: |
        Custom attribute values by key. On a write a value sets the key and `null` or an empty
        string removes it. Types: `text` (string, at most 1000 characters), `number` (JSON number),
        `date` (`YYYY-MM-DD`), `boolean`, `list` (one of the definition's options), `link`
        (http or https URL). Unknown keys are rejected with `unknown_attribute`.
      additionalProperties:
        oneOf:
          - { type: string }
          - { type: number }
          - { type: boolean }
          - { type: "null" }
    CrmContactItem:
      type: object
      required: [id, name, phone, email, organization, custom_attributes, conversation_count, created_at, last_activity_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string, description: "The primary address." }
        organization: { allOf: [{ $ref: "#/components/schemas/Ref" }], nullable: true }
        custom_attributes: { $ref: "#/components/schemas/CustomAttributeValues" }
        conversation_count: { type: integer, description: "Readable conversations only." }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
    CrmContactAddress:
      type: object
      required: [email, primary]
      properties:
        email: { type: string }
        primary: { type: boolean }
        bounced_at: { type: string, format: date-time, description: "Only present after a permanent delivery failure; campaigns skip the address." }
    CrmContact:
      type: object
      required: [id, name, phone, emails, organization, custom_attributes, conversation_count, created_at, updated_at, last_activity_at, unsubscribed_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        emails: { type: array, items: { $ref: "#/components/schemas/CrmContactAddress" } }
        organization: { allOf: [{ $ref: "#/components/schemas/Ref" }], nullable: true }
        custom_attributes: { $ref: "#/components/schemas/CustomAttributeValues" }
        conversation_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        unsubscribed_at: { type: string, format: date-time, nullable: true, description: "Set when the contact opted out of campaigns." }
    CrmContactInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 50 }
        emails:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [email]
            properties:
              email: { type: string }
              primary: { type: boolean }
        organization_id: { type: string, format: uuid, nullable: true }
        custom_attributes: { $ref: "#/components/schemas/CustomAttributeValues" }
    CrmNote:
      type: object
      required: [id, body, author, created_at, updated_at, can_edit]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { allOf: [{ $ref: "#/components/schemas/Ref" }], nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        can_edit: { type: boolean, description: "The author or an admin, and not a read-only user." }
    CrmNoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 10000 }
    TimelineItem:
      type: object
      required: [id, kind, type, at, actor, user, conversation, text, data]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [event, note] }
        type: { type: string, description: "The conversation event type, or `note`." }
        at: { type: string, format: date-time }
        actor: { allOf: [{ $ref: "#/components/schemas/Ref" }], nullable: true }
        user: { allOf: [{ $ref: "#/components/schemas/Ref" }], nullable: true, description: "The agent an assignment event refers to." }
        conversation:
          type: object
          nullable: true
          required: [id, number, subject]
          properties:
            id: { type: string, format: uuid }
            number: { type: integer, format: int64 }
            subject: { type: string }
        text: { type: string, description: "The note text for notes." }
        data: { type: object, additionalProperties: true }
    OrganizationItem:
      type: object
      required: [id, name, domains, contact_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        domains: { type: array, items: { type: string } }
        contact_count: { type: integer, description: "Visible contacts only." }
        created_at: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, name, domains, custom_attributes, contact_count, created_at, updated_at, contacts]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        domains: { type: array, items: { type: string } }
        custom_attributes: { $ref: "#/components/schemas/CustomAttributeValues" }
        contact_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        contacts:
          type: array
          items:
            type: object
            required: [id, name, email, last_activity_at]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              last_activity_at: { type: string, format: date-time }
    OrganizationInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        domains: { type: array, maxItems: 20, items: { type: string } }
        custom_attributes: { $ref: "#/components/schemas/CustomAttributeValues" }
    AttributeDef:
      type: object
      required: [id, entity, key, label, type, options, created_at]
      properties:
        id: { type: string, format: uuid }
        entity: { type: string, enum: [contact, organization, conversation] }
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, number, date, boolean, list, link] }
        options: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    ContactFilter:
      type: object
      description: |
        Conditions over contacts. `field` is one of `name`, `email` and `domain` (any address),
        `organization`, `has_open_conversation`, `last_activity`, `attribute` (a contact attribute
        `key`) and `conversation_attribute` (some readable conversation has the value). Operators:
        `contains`, `not_contains`, `equals`, `not_equals`, `starts_with`, `is_set`, `is_not_set`
        for text; `is_true`, `is_false` for `has_open_conversation` and boolean attributes;
        `before`, `on_or_after` (a `YYYY-MM-DD` value), `within_days`, `older_than_days` for
        `last_activity`; `gt`, `lt` for numbers. The allowed operators depend on the field and the
        attribute type; others are rejected.
      required: [conditions]
      properties:
        match: { type: string, enum: [all, any], default: all }
        conditions:
          type: array
          maxItems: 20
          items:
            type: object
            required: [field, op]
            properties:
              field: { type: string, enum: [name, email, domain, organization, has_open_conversation, last_activity, attribute, conversation_attribute] }
              op: { type: string }
              key: { type: string }
              value: { type: string, maxLength: 200 }
    ContactSegment:
      type: object
      required: [id, name, shared, owner, filter, can_edit, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shared: { type: boolean }
        owner: { $ref: "#/components/schemas/Ref" }
        filter: { $ref: "#/components/schemas/ContactFilter" }
        can_edit: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactImportOptions:
      type: object
      required: [dedupe, columns]
      properties:
        delimiter: { type: string, enum: [",", ";"], description: "Detected when left out." }
        dedupe: { type: string, enum: [update, skip] }
        columns:
          type: array
          items:
            type: object
            required: [index, target]
            properties:
              index: { type: integer, minimum: 0, description: "Zero-based column of the file." }
              target: { type: string, description: "`email`, `name`, `phone`, `organization` or `attribute:<key>` of a contact attribute." }
    ContactImport:
      type: object
      required: [id, status, filename, total_rows, processed_rows, created_count, updated_count, skipped_count, failed_count, has_errors, error, created_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed] }
        filename: { type: string }
        total_rows: { type: integer }
        processed_rows: { type: integer }
        created_count: { type: integer }
        updated_count: { type: integer }
        skipped_count: { type: integer }
        failed_count: { type: integer }
        has_errors: { type: boolean, description: "An error report can be downloaded." }
        error: { type: string, description: "A code when the whole import failed." }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    DataExport:
      type: object
      required: [id, status, error, size_bytes, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, ready, failed, downloaded, expired] }
        error: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ReportPeriod:
      type: object
      required: [preset, from, to, timezone, group, days]
      properties:
        preset: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Last day, inclusive. }
        timezone: { type: string }
        group: { type: string, enum: [day, week] }
        days: { type: integer }
    ReportDuration:
      type: object
      required: [count, median_seconds, p90_seconds]
      properties:
        count: { type: integer }
        median_seconds: { type: integer, format: int64, nullable: true }
        p90_seconds: { type: integer, format: int64, nullable: true }
    ReportRate:
      type: object
      required: [met, total]
      properties:
        met: { type: integer }
        total: { type: integer, description: "Conversations that could be judged; zero means no SLA data." }
    ReportMetrics:
      type: object
      required: [new_conversations, customer_messages, replies, resolved, reopened, first_response, resolution, sla_first_response, sla_resolution]
      properties:
        new_conversations: { type: integer, format: int64 }
        customer_messages: { type: integer, format: int64 }
        replies: { type: integer, format: int64 }
        resolved: { type: integer, format: int64 }
        reopened: { type: integer, format: int64 }
        first_response: { $ref: "#/components/schemas/ReportDuration" }
        resolution: { $ref: "#/components/schemas/ReportDuration" }
        sla_first_response: { $ref: "#/components/schemas/ReportRate" }
        sla_resolution: { $ref: "#/components/schemas/ReportRate" }
    ReportCsatSummary:
      type: object
      required: [sent, responses, average, response_rate, distribution]
      properties:
        sent: { type: integer }
        responses: { type: integer }
        average: { type: number, nullable: true, description: "Mean rating, one decimal." }
        response_rate: { type: number, nullable: true, description: "Percentage of sent surveys that were answered." }
        distribution:
          type: array
          description: Answers per rating, 1 to 5.
          items: { type: integer }
          minItems: 5
          maxItems: 5
    ReportOverview:
      type: object
      required: [period, time_basis, current, previous, series, open_now, csat, lifecycle, first_response_target]
      properties:
        period: { $ref: "#/components/schemas/ReportPeriod" }
        time_basis: { type: string, enum: [wall_clock, business_hours, mixed] }
        current: { $ref: "#/components/schemas/ReportMetrics" }
        previous: { $ref: "#/components/schemas/ReportMetrics" }
        series:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ReportMetrics" }
              - type: object
                required: [date, unanswered]
                properties:
                  date: { type: string, format: date, description: First day of the bucket. }
                  unanswered:
                    type: integer
                    format: int64
                    description: Conversations created in the bucket that are open without a first reply from us.
        open_now: { type: integer, format: int64 }
        csat: { $ref: "#/components/schemas/ReportCsatSummary" }
        lifecycle:
          type: object
          description: |
            Where the conversations created in the period stand now. `answered` and `unanswered`
            (by whether we sent a first reply) together equal `current.new_conversations`;
            `arrived` adds `spam`.
          required: [arrived, spam, answered, unanswered]
          properties:
            arrived: { type: integer, format: int64 }
            spam: { type: integer, format: int64 }
            answered: { $ref: "#/components/schemas/ReportStatusCounts" }
            unanswered: { $ref: "#/components/schemas/ReportStatusCounts" }
        first_response_target:
          type: object
          description: The median first-response target of the SLA policies the period's conversations had.
          required: [count, seconds]
          properties:
            count: { type: integer, format: int64, description: Conversations that had a target. }
            seconds: { type: integer, format: int64, nullable: true, description: Null when none had one. }
    ReportStatusCounts:
      type: object
      required: [open, waiting, closed]
      properties:
        open: { type: integer, format: int64 }
        waiting: { type: integer, format: int64 }
        closed: { type: integer, format: int64 }
    ReportTable:
      type: object
      required: [period, time_basis, rows]
      properties:
        period: { $ref: "#/components/schemas/ReportPeriod" }
        time_basis: { type: string, enum: [wall_clock, business_hours, mixed] }
        rows:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ReportMetrics" }
              - type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid, nullable: true }
                  name: { type: string }
    ReportCsat:
      type: object
      required: [period, by, summary, series, rows, comments]
      properties:
        period: { $ref: "#/components/schemas/ReportPeriod" }
        by: { type: string, enum: [agent, team, mailbox, label] }
        summary: { $ref: "#/components/schemas/ReportCsatSummary" }
        series:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ReportCsatSummary" }
              - type: object
                required: [date]
                properties:
                  date: { type: string, format: date }
        rows:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ReportCsatSummary" }
              - type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid, nullable: true }
                  name: { type: string }
        comments:
          type: array
          items:
            type: object
            required: [conversation_id, number, subject, rating, comment, at, assignee]
            properties:
              conversation_id: { type: string, format: uuid }
              number: { type: integer, format: int64 }
              subject: { type: string }
              rating: { type: integer }
              comment: { type: string }
              at: { type: string, format: date-time }
              assignee: { type: string }
    ReportLive:
      type: object
      required: [open, unassigned, waiting, sla_at_risk, sla_breached, agents, attention, at]
      properties:
        open: { type: integer, format: int64 }
        unassigned: { type: integer, format: int64 }
        waiting: { type: integer, format: int64 }
        sla_at_risk: { type: integer, format: int64 }
        sla_breached: { type: integer, format: int64 }
        agents:
          type: array
          items:
            type: object
            required: [id, name, open, waiting, sla_risk, online, availability]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              open: { type: integer, format: int64 }
              waiting: { type: integer, format: int64 }
              sla_risk: { type: integer, format: int64 }
              online: { type: boolean }
              availability: { type: string, enum: [online, busy, offline] }
        attention:
          type: object
          description: |
            Open, not snoozed conversations without a first reply from us. `breached` are past their
            first-response due time, `due_soon` reach it within `window_minutes`. `holders` are the
            people holding breached or due soon conversations (only yourself unless you may view all
            agents); `unassigned` counts those nobody holds.
          required: [unanswered, breached, due_soon, next_due_seconds, oldest_seconds, unassigned, holders, window_minutes]
          properties:
            unanswered: { type: integer, format: int64 }
            breached: { type: integer, format: int64 }
            due_soon: { type: integer, format: int64 }
            next_due_seconds: { type: integer, format: int64, description: Time until the first due soon conversation is due; 0 when there is none. }
            oldest_seconds: { type: integer, format: int64, description: Age of the longest-waiting unanswered conversation; 0 when there is none. }
            unassigned: { type: integer, format: int64 }
            window_minutes: { type: integer }
            holders:
              type: array
              items:
                type: object
                required: [id, name, count]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  count: { type: integer, format: int64 }
        at: { type: string, format: date-time }
    ReportSettings:
      type: object
      required: [timezone]
      properties:
        timezone: { type: string, description: "IANA name; default Europe/Amsterdam." }
    CsatSettings:
      type: object
      required: [enabled, delay_hours]
      properties:
        enabled: { type: boolean }
        delay_hours: { type: integer, minimum: 0, maximum: 24 }
    KbPortal:
      type: object
      required: [name, title, intro, logo_text, custom_domain, public_url, updated_at]
      properties:
        name: { type: string }
        title: { type: string }
        intro: { type: string }
        logo_text: { type: string }
        custom_domain: { type: string }
        public_url: { type: string, description: "Address of the public home page." }
        updated_at: { type: string, format: date-time }
    KbCategory:
      type: object
      required: [id, parent_id, name, slug, description, position, article_count, published_count]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        position: { type: integer }
        article_count: { type: integer }
        published_count: { type: integer }
    KbCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 80, description: "Lowercase letters, digits and dashes; derived from the name when empty." }
        description: { type: string, maxLength: 300 }
        parent_id: { type: string, format: uuid, nullable: true }
        position: { type: integer, minimum: 0, maximum: 10000 }
    KbArticle:
      type: object
      required: [id, title, slug, excerpt, status, category_id, category_name, version, view_count, helpful_yes, helpful_no, updated_at, updated_by_name, published_at, public_url]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        category_id: { type: string, format: uuid, nullable: true }
        category_name: { type: string, nullable: true }
        version: { type: integer, format: int32 }
        view_count: { type: integer, format: int64 }
        helpful_yes: { type: integer }
        helpful_no: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by_name: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        public_url: { type: string, nullable: true, description: "Absolute address while the article is published." }
    KbArticleDetail:
      allOf:
        - { $ref: "#/components/schemas/KbArticle" }
        - type: object
          required: [body_html, created_at]
          properties:
            body_html: { type: string, description: "Sanitized HTML." }
            created_at: { type: string, format: date-time }
    KbArticleInput:
      type: object
      required: [title, body_html]
      properties:
        title: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 80, description: "Lowercase letters, digits and dashes. Required on update." }
        category_id: { type: string, format: uuid, nullable: true }
        body_html: { type: string, maxLength: 524288 }
        excerpt: { type: string, maxLength: 300, description: "Empty means: the start of the text." }
    TrashedConversation:
      type: object
      required: [id, number, subject, status, preview, last_message_at, message_count, mailbox, contact, deleted_at, deleted_by]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        subject: { type: string }
        status: { type: string, enum: [open, waiting, closed, spam] }
        preview: { type: string }
        last_message_at: { type: string, format: date-time }
        message_count: { type: integer }
        mailbox: { type: object, properties: { id: { type: string }, name: { type: string } } }
        contact: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, email: { type: string } } }
        deleted_at: { type: string, format: date-time }
        deleted_by: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
    BlockedSender:
      type: object
      required: [id, mailbox, pattern, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        mailbox: { type: object, properties: { id: { type: string }, name: { type: string } } }
        pattern: { type: string, description: "An address, or a domain without @." }
        created_by: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        created_at: { type: string, format: date-time }
    RetentionPeriods:
      type: object
      required: [closed_conversation_months, attachment_months, spam_days, trash_days]
      properties:
        closed_conversation_months:
          { type: integer, minimum: 1, maximum: 120, nullable: true, description: "Delete closed conversations, with their messages and files, this many months after their last activity." }
        attachment_months:
          { type: integer, minimum: 1, maximum: 120, nullable: true, description: "Delete attachments (and the raw copy of their message) this many months after the message arrived; the text stays." }
        spam_days:
          { type: integer, minimum: 1, maximum: 3650, nullable: true, description: "Delete spam conversations this many days after their last activity." }
        trash_days:
          { type: integer, minimum: 1, maximum: 3650, nullable: true, description: "Delete conversations this many days after they were moved to the trash. Defaults to 30 for the workspace." }
    RetentionMailbox:
      allOf:
        - type: object
          required: [mailbox_id]
          properties:
            mailbox_id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/RetentionPeriods" }
    RetentionInput:
      type: object
      required: [global, audit_months, mailboxes]
      properties:
        global: { $ref: "#/components/schemas/RetentionPeriods" }
        audit_months: { type: integer, minimum: 3, maximum: 120, nullable: true, description: "Audit log retention; null keeps it forever." }
        mailboxes:
          type: array
          items: { $ref: "#/components/schemas/RetentionMailbox" }
    RetentionSettings:
      allOf:
        - { $ref: "#/components/schemas/RetentionInput" }
        - type: object
          required: [last_run]
          properties:
            last_run:
              type: object
              nullable: true
              required: [at, closed_conversations, spam_conversations, trash_conversations, attachments, audit_entries]
              properties:
                at: { type: string, format: date-time }
                closed_conversations: { type: integer, format: int64 }
                spam_conversations: { type: integer, format: int64 }
                trash_conversations: { type: integer, format: int64 }
                attachments: { type: integer, format: int64 }
                audit_entries: { type: integer, format: int64 }
    RetentionImpact:
      type: object
      required: [conversations, messages, attachments, attachment_bytes]
      properties:
        conversations: { type: integer, format: int64 }
        messages: { type: integer, format: int64 }
        attachments: { type: integer, format: int64 }
        attachment_bytes: { type: integer, format: int64 }
    RetentionPreview:
      type: object
      required: [closed_conversations, spam_conversations, trash_conversations, attachments, audit_entries]
      properties:
        closed_conversations: { $ref: "#/components/schemas/RetentionImpact" }
        spam_conversations: { $ref: "#/components/schemas/RetentionImpact" }
        trash_conversations: { $ref: "#/components/schemas/RetentionImpact" }
        attachments:
          allOf:
            - { $ref: "#/components/schemas/RetentionImpact" }
          description: "Files removed while their message stays; only `attachments` and `attachment_bytes` are filled."
        audit_entries: { type: integer, format: int64 }
    KeyStatusEntry:
      type: object
      required: [id, active, values, columns]
      properties:
        id: { type: string }
        active: { type: boolean, description: "The key that encrypts new values." }
        values: { type: integer, format: int64, description: "Stored secrets encrypted with this key." }
        columns:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: "Counts per `table.column`."
    KeyStatus:
      type: object
      required: [keys, unknown]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/KeyStatusEntry" }
        unknown:
          type: array
          items: { $ref: "#/components/schemas/KeyStatusEntry" }
          description: "Key ids found in the database that are not configured; those values cannot be read."
    CampaignCounts:
      type: object
      required: [total, pending, queued, sent, failed, skipped, skipped_reasons]
      properties:
        total: { type: integer }
        pending: { type: integer, description: "Not handed to the send queue yet." }
        queued: { type: integer, description: "In the send queue; delivery is still open." }
        sent: { type: integer }
        failed: { type: integer, description: "Includes messages whose outcome is uncertain and messages that bounced." }
        skipped: { type: integer }
        skipped_reasons:
          type: object
          description: Skipped recipients by reason (`unsubscribed`, `no_address`, `duplicate`, `bounced`, `cancelled`).
          additionalProperties: { type: integer }
    Campaign:
      type: object
      required: [id, name, status, mailbox, segment, subject, body_html, rate_per_minute, scheduled_at, started_at, finished_at, error, created_by, created_at, updated_at, counts]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, scheduled, sending, paused, done, cancelled] }
        mailbox:
          type: object
          required: [id, name, address]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            address: { type: string, format: email }
        segment:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
          description: The name is kept when the segment is deleted; `id` is then empty.
        subject: { type: string }
        body_html: { type: string }
        rate_per_minute: { type: integer, description: "Messages per minute from the mailbox, at most `limits.max_rate`." }
        scheduled_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        error:
          type: string
          description: |
            Why the campaign stopped by itself: `segment_missing` or `creator_unavailable` (cancelled),
            `mailbox_unavailable` (paused until the mailbox is enabled again), else empty.
        created_by: { allOf: [{ $ref: "#/components/schemas/Ref" }], nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/CampaignCounts" }
    CampaignEnvelope:
      type: object
      required: [campaign]
      properties:
        campaign: { $ref: "#/components/schemas/Campaign" }
    CampaignInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        mailbox_id: { type: string, format: uuid }
        segment_id: { type: string, description: "A segment id, or an empty string to clear it." }
        subject: { type: string, maxLength: 300 }
        body_html: { type: string }
        rate_per_minute: { type: integer, minimum: 1, default: 60 }
    CampaignPreview:
      type: object
      required: [total, sendable, unsubscribed, no_address, duplicate, bounced, without_name]
      properties:
        total: { type: integer }
        sendable: { type: integer }
        unsubscribed: { type: integer }
        no_address: { type: integer }
        duplicate: { type: integer }
        bounced: { type: integer }
        without_name: { type: integer, description: "Sendable recipients with no name, for whom `contact.first_name` comes out empty." }
    CampaignRecipient:
      type: object
      required: [id, email, name, state, skip_reason, delivery, error, conversation_id, queued_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        state: { type: string, enum: [pending, queued, sent, failed, skipped] }
        skip_reason: { type: string, description: "Empty unless skipped." }
        delivery: { type: string, description: "The send queue's status of the message while it exists, else empty." }
        error: { type: string }
        conversation_id: { type: string, description: "The conversation the message went out in; replies land there." }
        queued_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
